# Generated by enact from .enact; edit the pipeline and run `enact ci generate`.
name: n8n-platform
on:
  push:
    branches:
    - main
    - master
    - perf/ci-modernization
    - perf/ci-showcase
  pull_request:
    branches:
    - main
    - master
    - perf/ci-modernization
    - perf/ci-showcase
  workflow_dispatch:
    inputs:
      all:
        description: Force execution of all components regardless of git changes
        required: false
        default: "false"
      base_ref:
        description: Target base branch for diff detection (e.g. main, master, a release branch)
        required: false
      files:
        description: File(s) to plan as changed instead of the git diff, comma-separated (e.g. one test file)
        required: false
      no_cache:
        description: Disable task cache, forcing full execution
        required: false
        default: "false"
      updated:
        description: Component(s) to emulate as updated
        required: false
      warm_reach:
        description: Run every suite and record each test without a fresh reach footprint (on the default branch, after an enact upgrade)
        required: false
        default: "false"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  ENACT_REMOTE_SAVE_EVENT: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
  ENACT_SAVE_EVENT: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
  ENVE_CACHE_PUBLIC_KEY: enve-r2-1:ckHPTeWVef6mba+1AwWHjKYCsUWKPfP9IXPm5YXNoHg=
  ENVE_SERVICE_GID: "1000"
  ENVE_SERVICE_UID: "1000"
  ENVE_SUBSTITUTERS: https://pub-30fd937eb7634039b8c49d49bfec91a9.r2.dev,https://cache.nixos.org
  ENVE_TRUSTED_PUBLIC_KEYS: enve-r2-1:ckHPTeWVef6mba+1AwWHjKYCsUWKPfP9IXPm5YXNoHg=
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: --max-old-space-size=6144
  UV_CACHE_DIR: /tmp/.cache/uv
  XDG_CACHE_HOME: /tmp/.cache
jobs:
  build-outputs--n8n-db--build:
    name: Build Outputs
    needs:
    - detect
    if: ${{ needs.detect.outputs.builds__n8n_db__build != '{"include":[]}' && needs.detect.outputs.builds__n8n_db__build != '[]' && needs.detect.outputs.builds__n8n_db__build != '' }}
    uses: ./.github/workflows/enact-ci-matrix.yml
    with:
      history_input_artifact: ${{ needs.detect.outputs.history_input_artifact }}
      matrix: ${{ needs.detect.outputs.builds__n8n_db__build }}
      warm_reach: ${{ inputs.warm_reach }}
    secrets: inherit
  build-outputs-playwright--build:
    name: Build Outputs
    needs:
    - detect
    if: ${{ needs.detect.outputs.builds_playwright__build != '{"include":[]}' && needs.detect.outputs.builds_playwright__build != '[]' && needs.detect.outputs.builds_playwright__build != '' }}
    uses: ./.github/workflows/enact-ci-matrix.yml
    with:
      history_input_artifact: ${{ needs.detect.outputs.history_input_artifact }}
      matrix: ${{ needs.detect.outputs.builds_playwright__build }}
      warm_reach: ${{ inputs.warm_reach }}
    secrets: inherit
  detect:
    name: Detect Affected Components
    env:
      ENACT_OBSERVATIONS_ENABLED: "1"
    permissions:
      actions: read
      contents: read
    runs-on:
    - self-hosted
    - Linux
    - X64
    - tonky-ci
    - tonky-ci-c2m4g
    timeout-minutes: 5
    outputs:
      builds__n8n_db__build: ${{ steps.diff.outputs.builds__n8n_db__build }}
      builds_playwright__build: ${{ steps.diff.outputs.builds_playwright__build }}
      built__n8n_db__build: ${{ steps.diff.outputs.built__n8n_db__build }}
      built__n8n_db__build_playwright__build: ${{ steps.diff.outputs.built__n8n_db__build_playwright__build }}
      history_input_artifact: ${{ steps.history_restore.outputs.artifact }}
      matrix: ${{ steps.diff.outputs.matrix }}
    steps:
    - name: Probe Runner Caches
      id: runner_caches
      run: |
        set -euo pipefail
        host="${ENACT_HOST_CACHE:-}"
        if [ -n "$host" ] && ! { [ -d "$host/repo" ] && [ -w "$host/repo" ]; }; then
            echo "::warning::ENACT_HOST_CACHE=$host has no writable repo/ directory; using GitHub's cache"
            host=""
        fi
        if [ -n "$host" ]; then
            mkdir -p "$host/repo/git" "$host/repo/outputs"
            echo "ENACT_GIT_MIRROR=$host/repo/git/${GITHUB_REPOSITORY##*/}.git" >> "$GITHUB_ENV"
            echo "ENACT_OUTPUTS_CACHE=$host/repo/outputs" >> "$GITHUB_ENV"
        fi
        echo "ENACT_HOST_CACHE=$host" >> "$GITHUB_ENV"
        printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
        printf 'Host cache: %s\n' "${host:-none}"
    - name: Checkout Repository (sparse) from the Host Mirror
      id: host_checkout
      if: ${{ steps.runner_caches.outputs.host != '' }}
      continue-on-error: true
      run: |
        set -euo pipefail
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        mirror="$ENACT_GIT_MIRROR"
        export GIT_CONFIG_COUNT=2
        export GIT_CONFIG_KEY_0=safe.directory
        export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
        export GIT_CONFIG_KEY_1=safe.directory
        export GIT_CONFIG_VALUE_1="$mirror"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        refs=("+refs/heads/*:refs/heads/*")
        case "$GITHUB_REF" in
            refs/pull/*) refs+=("+$GITHUB_REF:$GITHUB_REF") ;;
        esac
        (
            flock 9
            if [ ! -f "$mirror/HEAD" ]; then
                git init -q --bare "$mirror"
                git -C "$mirror" config uploadpack.allowAnySHA1InWant true
                git -C "$mirror" config gc.auto 0
            fi
            ref_current=""
            case "$GITHUB_REF" in
                refs/heads/*|refs/pull/*) ref_current=$(git -C "$mirror" rev-parse --verify -q "$GITHUB_REF^{commit}" 2>/dev/null || true) ;;
                *) ref_current="$GITHUB_SHA" ;;
            esac
            if [ -z "$(find "$mirror/HEAD" -mmin -1 2>/dev/null || true)" ] || [ "$ref_current" != "$GITHUB_SHA" ] || ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags --prune "$url" "${refs[@]}"
                if ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags "$url" "$GITHUB_SHA"
                fi
            fi
            touch "$mirror" "$mirror/HEAD" 2>/dev/null || true
        ) 9>"$mirror.lock"
        cd "$GITHUB_WORKSPACE"
        trap 'rm -rf "$GITHUB_WORKSPACE/.git"' ERR
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        echo "$mirror/objects" > .git/objects/info/alternates
        [ ! -f "$mirror/shallow" ] || cp "$mirror/shallow" .git/shallow
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local gc.auto 0
        git fetch -q --no-tags "$mirror" "+refs/heads/*:refs/remotes/origin/*"
        if [ -n "${ENACT_SPARSE_CONE:-}" ]; then
            mapfile -t cone < <(printf '%s\n' "$ENACT_SPARSE_CONE" | sed '/^[[:space:]]*$/d')
            git sparse-checkout set --cone "${cone[@]}"
        fi
        case "$GITHUB_REF" in
            refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$GITHUB_SHA" ;;
            *) git checkout -q --force --detach "$GITHUB_SHA" ;;
        esac
        git log -1 --format='Checked out %H through the host mirror'
      env:
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: |-
          .enact
          cue.mod
          .github
          bin
          enve.cue
          enve.lock
          helpers
          patches
          scripts
          package.json
          pnpm-lock.yaml
          pnpm-workspace.yaml
          turbo.json
          tsconfig.json
          tsconfig.configs.json
          biome.jsonc
          vitest.workspace.ts
          .prettierrc.js
          .prettierignore
          .boundaries-baseline.json
          packages/@n8n/eslint-plugin-community-nodes
          packages/@n8n/module-cli
          packages/@n8n/typescript-config
    - name: Checkout Repository (sparse)
      if: ${{ steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        sparse-checkout: |-
          .enact
          cue.mod
          .github
          bin
          enve.cue
          enve.lock
          helpers
          patches
          scripts
          package.json
          pnpm-lock.yaml
          pnpm-workspace.yaml
          turbo.json
          tsconfig.json
          tsconfig.configs.json
          biome.jsonc
          vitest.workspace.ts
          .prettierrc.js
          .prettierignore
          .boundaries-baseline.json
          packages/@n8n/eslint-plugin-community-nodes
          packages/@n8n/module-cli
          packages/@n8n/typescript-config
        sparse-checkout-cone-mode: "true"
        submodules: "false"
    - name: Restore Reach Store
      id: reach-store
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: enact-reach-${{ github.head_ref || github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .git/enact/reach
        restore-keys: |-
          enact-reach-${{ github.head_ref || github.ref_name }}-${{ github.sha }}-
          enact-reach-${{ github.head_ref || github.ref_name }}-
          enact-reach-${{ github.base_ref || github.event.repository.default_branch }}-
    - name: Install committed enact & enve builds
      run: |
        P="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        E="${GITHUB_WORKSPACE:-$PWD}/bin/$P/enact"
        [ -f "$E" ] || E="${GITHUB_WORKSPACE:-$PWD}/bin/enact"
        [ -f "$E" ] || E="$(command -v enact || echo "$HOME/.cargo/bin/enact")"
        chmod +x "$E" 2>/dev/null || true
        "$E" --version >/dev/null 2>&1 || { echo "::error title=No enact for $P::$E does not run on this $P runner; commit its build as bin/$P/enact"; exit 1; }
        "$E" ci install-binaries
    - name: Ensure enve & enact CLI on PATH
      run: enact ci setup-runner
    - name: Select Immutable CI History
      id: history_restore
      run: |-
        enact ci history restore --pipeline "$ENACT_HISTORY_PIPELINE" --repo "$GITHUB_REPOSITORY" --workflow "$ENACT_HISTORY_WORKFLOW" --head "$ENACT_HISTORY_HEAD" --output "$RUNNER_TEMP/enact-history-input/snapshot.json" --max-runs 8 --max-age-days 14 --max-bytes 4194304
        export ENACT_HISTORY_DIR="$RUNNER_TEMP/enact-history"
        printf 'ENACT_HISTORY_DIR=%s\n' "$ENACT_HISTORY_DIR" >> "$GITHUB_ENV"
        enact ci history import --input "$RUNNER_TEMP/enact-history-input/snapshot.json" --manifest "$RUNNER_TEMP/enact-history-input/snapshot.manifest.json" --output "$ENACT_HISTORY_DIR"
        printf 'artifact=enact-history-input-v1-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      env:
        ENACT_HISTORY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        ENACT_HISTORY_PIPELINE: .enact
        ENACT_HISTORY_WORKFLOW: .github/workflows/enact-ci.yml
        GH_TOKEN: ${{ github.token }}
    - name: Hand CI History to the Jobs
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: error
        name: enact-history-input-v1-${{ github.run_attempt }}
        path: |-
          ${{ runner.temp }}/enact-history-input/snapshot.json
          ${{ runner.temp }}/enact-history-input/snapshot.manifest.json
        retention-days: "14"
    - name: Compute Affected Component Matrix
      id: diff
      run: |-
        if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
          cd "${GITHUB_WORKSPACE}"
        fi
        RESOLVED=$(enact ci resolve-base) || exit
        eval "$RESOLVED"
        ADMISSION_REPORT="$RUNNER_TEMP/enact-admission.json"
        MATRIX=$(enact ci matrix --pipeline .enact --workflow ci --github-output "$GITHUB_OUTPUT" --reach-hand-off "$RUNNER_TEMP/enact-reach" --selection-record .enact/state/selection.json --budget --budget-report "$ADMISSION_REPORT" "$@" --format json) || {
          status=$?
          echo "::error::CI budget admission failed; report: $ADMISSION_REPORT" >&2
          exit "$status"
        }
        if [ -n "${ENACT_HOST_CACHE:-}" ] && [ -d "$ENACT_HOST_CACHE/repo" ] && [ -w "$ENACT_HOST_CACHE/repo" ] && [ -d "$RUNNER_TEMP/enact-reach" ] && [ -f "$RUNNER_TEMP/enact-reach/map.bin" ]; then
