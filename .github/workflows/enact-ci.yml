    - build-outputs--n8n-db--build
    - build-outputs-cli--build
    if: ${{ !cancelled() && needs.detect.result == 'success' && needs.build-outputs--n8n-db--build.result != 'failure' && needs.build-outputs--n8n-db--build.result != 'cancelled' && needs.build-outputs-cli--build.result != 'failure' && needs.build-outputs-cli--build.result != 'cancelled' && needs.detect.outputs.builds_playwright__build != '{"include":[]}' && needs.detect.outputs.builds_playwright__build != '[]' && needs.detect.outputs.builds_playwright__build != '' && needs.lookup-outputs-playwright--build.outputs.hit != 'true' }}
    uses: ./.github/workflows/enact-ci-matrix.yml
    with:
      control_checkout_sha: ${{ inputs.control_checkout_sha }}
      control_pin_required: ${{ inputs.control_pin_required }}
      control_pr_head_sha: ${{ needs.detect.outputs.control_pr_head_sha }}
