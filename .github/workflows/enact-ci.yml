# Generated by enact from .enact; edit the pipeline and run `enact transpile`.
name: n8n-platform
on:
  push:
    branches:
    - main
    - master
    - perf/ci-modernization
    - perf/ci-showcase
  pull_request:
    branches:
    - main
    - master
    - perf/ci-modernization
  workflow_dispatch:
    inputs:
      all:
        description: Force execution of all components regardless of git changes
        required: false
        default: "false"
      base_ref:
        description: Target base branch for diff detection (e.g. main, master, a release branch)
        required: false
      no_cache:
        description: Disable task cache, forcing full execution
        required: false
        default: "false"
      updated:
        description: Component(s) to emulate as updated
        required: false
      warm_reach:
        description: Run every suite and record each test without a fresh reach footprint (on the default branch, after an enact upgrade)
        required: false
        default: "false"
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  ENVE_SERVICE_GID: "1000"
  ENVE_SERVICE_UID: "1000"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GOCACHE: /tmp/go-build
  GOPATH: /tmp/go
  NODE_OPTIONS: --max-old-space-size=6144
  UV_CACHE_DIR: ${{ vars.ENACT_UV_CACHE_DIR || '/tmp/.cache/uv' }}
  XDG_CACHE_HOME: /tmp/.cache
jobs:
  check-and-lint:
    name: "Stage: Check And Lint"
    runs-on:
    - self-hosted
    - Linux
    - X64
    - tonky-ci
    timeout-minutes: 15
    steps:
    - name: Checkout Repository (sparse)
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        sparse-checkout: |-
          .enact
          cue.mod
          .github
          bin
          enve.cue
          enve.lock
          helpers
          patches
          scripts
          package.json
          pnpm-lock.yaml
          pnpm-workspace.yaml
          turbo.json
          tsconfig.json
          tsconfig.configs.json
          biome.jsonc
          vitest.workspace.ts
          .prettierrc.js
          .prettierignore
          packages/@n8n/typescript-config
          packages/@n8n/agents
          packages/@n8n/ai-utilities
          packages/@n8n/api-types
          packages/@n8n/backend-common
          packages/@n8n/backend-network
          packages/@n8n/client-oauth2
          packages/@n8n/config
          packages/@n8n/constants
          packages/@n8n/decorators
          packages/@n8n/di
          packages/@n8n/errors
          packages/@n8n/eslint-config
          packages/@n8n/expression-runtime
          packages/@n8n/inbound-auth
          packages/@n8n/oxlint-config
          packages/@n8n/permissions
          packages/@n8n/tournament
          packages/@n8n/utils
          packages/@n8n/vitest-config
          packages/frontend/@n8n/eslint-plugin-design-system
          packages/nodes-base/nodes/ReadPdf/test/sample.pdf
          packages/workflow
          packages/@n8n/ai-node-sdk
          packages/@n8n/ai-workflow-builder.ee
          packages/@n8n/eslint-plugin-community-nodes
          packages/@n8n/workflow-sdk
          packages/modules/apps/backend
          .tbls.postgres.yml
          .tbls.sqlite.yml
          docs/generated
          packages/@n8n/backend-services
          packages/@n8n/backend-test-utils
          packages/@n8n/blob-storage
          packages/@n8n/db
          packages/@n8n/typeorm
          packages/cli/src/services/ownership-transfer/ownership-transfer.manifest.json
          packages/core
          packages/quality/environments/containers
          packages/modules/insights/backend
          packages/modules/quick-connect/backend
          packages/modules/workflow-builder/backend
          packages/frontend/@n8n/chat
          packages/@n8n/stylelint-config
          packages/@n8n/telemetry
          packages/frontend/@n8n/composables
          packages/frontend/@n8n/design-system
          packages/frontend/@n8n/frontend-constants
          packages/frontend/@n8n/frontend-utils
          packages/frontend/@n8n/i18n
          packages/@n8n/chat-hub
          packages/@n8n/cli
          packages/quality/policy/code-health
          packages/quality/policy/rules-engine
          packages/@n8n/codemirror-lang
          packages/@n8n/codemirror-lang-sql
          packages/@n8n/crdt
          helpers/schema-docs-postgres.mjs
          packages/quality/efficiency
          packages/@n8n/codemirror-lang-html
          packages/@n8n/engine
          packages/@n8n/imap
          packages/@n8n/instance-ai
          packages/@n8n/json-schema-to-zod
          packages/@n8n/mcp-apps
          packages/@n8n/mcp-browser
          packages/@n8n/mcp-browser-extension/manifest.json
          packages/@n8n/node-engine-compatibility
          packages/@n8n/nodes-langchain
          packages/@n8n/scheduler
          packages/@n8n/syslog-client
          packages/@n8n/task-runner
          packages/cli
          packages/cli/src/modules/instance-ai/internal-messages.ts
          packages/cli/src/modules/instance-ai/node-definition-resolver.ts
          packages/cli/tsconfig.json
          packages/frontend/@n8n/frontend-module-sdk
          packages/frontend/@n8n/frontend-test-utils
          packages/frontend/@n8n/frontend-vite-config
          packages/frontend/@n8n/rest-api-client
          packages/frontend/@n8n/stores
          packages/frontend/editor-ui
          packages/modules/inbox/frontend
          packages/modules/insights/frontend
          packages/modules/instance-registry/frontend
          packages/modules/mcp/frontend
          packages/modules/otel/frontend
          packages/modules/self-healing/frontend
          packages/modules/type-availability-policies/frontend
          packages/nodes-base
          packages/quality/testing/janitor
          packages/quality/testing/playwright
          packages/quality/testing/test-impact
          packages/@n8n/extension-sdk
          packages/@n8n/mcp-browser-extension
          packages/quality/efficiency/scale/benchmark
          packages/@n8n/node-cli
          packages/quality/efficiency/microbenchmarks
          packages/frontend/@n8n/storybook
          helpers/n8n-template-db.cjs
          packages/node-dev
          helpers/playwright-runner.sh
          helpers/n8n-ready.mjs
        sparse-checkout-cone-mode: "true"
        submodules: "false"
    - name: Install committed enact & enve builds
      run: |
        # The repository's committed enact, enve and bubblewrap builds: bin/<os>-<arch>/ for this runner
        # (bin/linux-x86_64/, bin/linux-aarch64/), else bin/. They're copied to ~/.cargo/bin,
        # which goes ahead of bin/ on PATH, so the runner's own build wins over bin/'s. A build for
        # another CPU (an x86_64 enve on an arm64 runner) is never installed: enact or enve fails
        # here, naming the directory to commit, instead of the first step that runs it.
        BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
        PLATFORM="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        # Whether this runner can execute $1: false only for an ELF of another CPU or OS.
        runs_here() {
          local header
          header="$(od -An -tx1 -N20 "$1" 2>/dev/null | tr -d ' \n')"
          [ "${header:0:8}" = 7f454c46 ] || return 0
          case "$PLATFORM:${header:36:4}" in
            linux-x86_64:3e00 | linux-aarch64:b700) return 0 ;;
          esac
          return 1
        }
        mkdir -p "$HOME/.cargo/bin"
        if [ -d "$BIN_DIR" ]; then
          for b in enact enve bwrap; do
            src="$BIN_DIR/$b"
            if [ -f "$BIN_DIR/$PLATFORM/$b" ]; then
              src="$BIN_DIR/$PLATFORM/$b"
            fi
            [ -f "$src" ] || continue
            if ! runs_here "$src"; then
              if [ "$b" = bwrap ]; then
                echo "::warning::bin/$b is a build for another CPU than this $PLATFORM runner: not installed"
                continue
              fi
              echo "::error title=No $b for $PLATFORM::bin/$b is a build for another CPU; commit this runner's as bin/$PLATFORM/$b"
              exit 1
            fi
            chmod +x "$src" 2>/dev/null || true
            cp -f "$src" "$HOME/.cargo/bin/$b"
          done
          echo "$BIN_DIR" >> "$GITHUB_PATH"
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Ensure enve & enact CLI on PATH
      run: |
        git config --global --add safe.directory "*" 2>/dev/null || true
        mkdir -p "$HOME/.local/share/enve/store"
        if command -v sudo >/dev/null 2>&1; then
          sudo mkdir -p -m 0755 /nix 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" /nix 2>/dev/null || true
        fi
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
        fi
        # The previous step's $GITHUB_PATH entries apply from the next step on.
        export PATH="$HOME/.cargo/bin:${GITHUB_WORKSPACE:-$PWD}/bin:$PATH"
        # Isolation as on a Linux workstation: with bubblewrap on PATH (e.g. the repository's
        # bin/bwrap), enve sandboxes commands and services and maps the profile's hosts inside.
        # GitHub's Ubuntu runners restrict unprivileged user namespaces (AppArmor), which bwrap
        # needs; the VM is disposable, so lift that. Without a working bwrap, enve runs on the host:
        # its profile's host aliases go to the runner's /etc/hosts instead.
        if command -v bwrap >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 \
          && [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        fi
        if command -v bwrap >/dev/null 2>&1 && bwrap --bind / / true 2>/dev/null; then
          echo "enve isolation: $(bwrap --version)"
        elif command -v sudo >/dev/null 2>&1 && command -v enve >/dev/null 2>&1 && [ -f enve.cue ]; then
          enve cue export -q -e profiles.dev.hosts enve.cue 2>/dev/null \
            | jq -r 'to_entries[] | "\(.value) \(.key)"' 2>/dev/null \
            | sudo tee -a /etc/hosts >/dev/null || true
        fi
    - name: Probe existing locked enve store
      id: enve_store_ready
      run: |
        #!/usr/bin/env bash
        # Readiness is an offline locked runtime check, never a fabricated archive hit.
        set -euo pipefail
        ready=false
        probe() {
            ENVE_OFFLINE=1 timeout --kill-after=2s 8s enve run --locked -- true >/dev/null 2>&1
        }
        if [ -f enve.lock ] && command -v timeout >/dev/null && command -v enve >/dev/null && probe; then
            ready=true
            component="${ENACT_COMPONENT_DIR:-.}"
            if [ "$component" != . ] && [ -n "$component" ]; then
                if [ ! -d "$component" ]; then
                    ready=false
                elif [ -f "$component/enve.lock" ] && ! (cd -- "$component" && probe); then
                    ready=false
                fi
            fi
        fi
        printf 'ready=%s\n' "$ready" >> "$GITHUB_OUTPUT"
        printf 'Existing locked enve environment ready: %s\n' "$ready"
    - parallel:
      - name: Restore enact Task CAS Cache
        id: enact-tasks-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-enact-tasks-${{ github.sha }}
          path: .enact/state/cache
          restore-keys: ${{ runner.os }}-enact-tasks-
      - name: Restore enve Store (L1 GHA Cache)
        id: nix_l1_cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-enve-store-v2-${{ hashFiles('**/enve.lock') }}
          lookup-only: ${{ steps.enve_store_ready.outputs.ready == 'true' }}
          path: ~/.local/share/enve/store
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-enve-store-v2-
      - name: Restore Node dependency cache
        id: node_l1_cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-node-v2-stage-check-and-lint-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'enve.lock', 'pnpm-workspace.yaml') }}
          path: |-
            .enact/state/pnpm-store
            node_modules/.cache
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node-v2-stage-check-and-lint-
      - name: Restore Cache [node_build]
        id: cache_node_build
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: node_build-${{ runner.os }}-stage-check-and-lint-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          path: .turbo
          restore-keys: node_build-${{ runner.os }}-stage-check-and-lint-
      - name: Restore Cache [vitest_transforms]
        id: cache_vitest_transforms
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: vitest_transforms-${{ runner.os }}-stage-check-and-lint-${{ hashFiles('pnpm-lock.yaml') }}
          path: node_modules/.vitest-cache
          restore-keys: vitest_transforms-${{ runner.os }}-stage-check-and-lint-
    - name: Download the Reach Map
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: enact-reach-map
        path: ${{ runner.temp }}/enact-reach
    - name: Plan with the Detected Reach Map
      run: |-
        if [ -f "$RUNNER_TEMP/enact-reach/map.bin" ]; then
          echo "ENACT_REACH_FILE=$RUNNER_TEMP/enact-reach/map.bin" >> "$GITHUB_ENV"
        fi
    - name: Pull Dependencies via enve
      run: |-
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
        fi
        if [ -f "enve.lock" ]; then
          enve run --locked -- true
        fi
    - name: Install Project Dependencies
      if: hashFiles('package.json') != ''
      run: |-
        RUN_PREFIX=""
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
          RUN_PREFIX="enve run --locked -- "
        fi
        echo "📦 Installing project dependencies..."
        ENACT_INSTALL_INPUTS=$(mktemp "$RUNNER_TEMP/enact-install-inputs.XXXXXX")
        sha256sum pnpm-lock.yaml > "$ENACT_INSTALL_INPUTS"
        for input in package.json pnpm-workspace.yaml enve.lock; do
          if [ -f "$input" ]; then sha256sum "$input" >> "$ENACT_INSTALL_INPUTS"; fi
        done
        $RUN_PREFIX pnpm install "$@" --frozen-lockfile --store-dir "$PWD/.enact/state/pnpm-store" --offline --config.audit=false --config.minimum-release-age=0 --config.package-import-method=hardlink --config.fetch-retries=2 --config.fetch-retry-maxtimeout=10000 --network-concurrency=16 ||
          $RUN_PREFIX pnpm install "$@" --frozen-lockfile --store-dir "$PWD/.enact/state/pnpm-store" --prefer-offline --config.audit=false --config.minimum-release-age=0 --config.package-import-method=hardlink --config.fetch-retries=2 --config.fetch-retry-maxtimeout=10000 --network-concurrency=16 || exit $?
        sha256sum --check "$ENACT_INSTALL_INPUTS"
        rm "$ENACT_INSTALL_INPUTS"
        echo "ENACT_PREPARED=${ENACT_PREPARED:+$ENACT_PREPARED,}node" >> "$GITHUB_ENV"
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        GITHUB_TOKEN: ""
    - name: Check workspace package integrity
      run: |-
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
          enve run --locked -- sh -c "$ENACT_STAGE_TASK"
        else
          sh -c "$ENACT_STAGE_TASK"
        fi
      env:
        ENACT_STAGE_TASK: node scripts/check-workspace-private-deps.mjs
    - name: Verify Pipeline Contracts & Sparse Cones (enact ci-verify)
      run: |-
        ENACT_BIN=""
        if command -v enact >/dev/null 2>&1; then
          ENACT_BIN="enact"
        elif [ -x "bin/enact" ]; then
          ENACT_BIN="bin/enact"
        fi
        if [ -n "$ENACT_BIN" ]; then
          echo "🔬 Running enact ci-verify..."
          $ENACT_BIN ci-verify --pipeline .enact --workflow ci
        fi
    - name: Execute Stage [Check And Lint]
      run: |-
        # Resolves the diff base, and leaves the planning flags of the `enact` command after this
        # script in "$@": --base, --all or --updated, --no-cache.
        BASE_REV=""
        BASE_REF="${ENACT_BASE_REF:-}"
        if [ -n "${ENACT_BASE_SHA:-}" ]; then
          if ! git rev-parse --verify "$ENACT_BASE_SHA" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "$ENACT_BASE_SHA" 2>/dev/null || true
          fi
          if git rev-parse --verify "$ENACT_BASE_SHA" >/dev/null 2>&1; then
            BASE_REV="$ENACT_BASE_SHA"
          fi
        fi
        if [ -z "$BASE_REV" ] && [ -z "$BASE_REF" ]; then
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ -n "${ENACT_EVENT_BEFORE:-}" ] && [ "${ENACT_EVENT_BEFORE:-}" != "0000000000000000000000000000000000000000" ]; then
              BASE_REF="${ENACT_EVENT_BEFORE:-}"
            else
              BASE_REF="HEAD~1"
            fi
          else
            INTEGRATION_BRANCH="${ENACT_INTEGRATION_BRANCH:-}"
            if [ -n "$INTEGRATION_BRANCH" ] && [ "$GITHUB_REF_NAME" != "$INTEGRATION_BRANCH" ] && [ "$GITHUB_REF_NAME" != "${ENACT_DEFAULT_BRANCH:-master}" ]; then
              if ! git rev-parse --verify "origin/$INTEGRATION_BRANCH" >/dev/null 2>&1; then
                git fetch --no-tags --depth=50 origin "$INTEGRATION_BRANCH" 2>/dev/null || true
              fi
              if git rev-parse --verify "origin/$INTEGRATION_BRANCH" >/dev/null 2>&1; then
                BASE_REF="$INTEGRATION_BRANCH"
              fi
            fi
            if [ -z "$BASE_REF" ]; then
              BASE_REF="${ENACT_DEFAULT_BRANCH:-master}"
            fi
          fi
        fi
        if [ -z "$BASE_REV" ] && [ -n "$BASE_REF" ]; then
          if ! git rev-parse --verify "$BASE_REF" >/dev/null 2>&1 && ! git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            git fetch --no-tags --depth=50 origin "$BASE_REF" 2>/dev/null || true
          fi
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            git fetch --deepen=100 origin 2>/dev/null || git fetch --unshallow origin 2>/dev/null || true
          fi
          MERGE_BASE=$(git merge-base HEAD "$BASE_REF" 2>/dev/null || git merge-base HEAD "origin/$BASE_REF" 2>/dev/null || echo "")
          if [ -z "$MERGE_BASE" ] && [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
            git fetch --deepen=500 origin 2>/dev/null || git fetch --unshallow origin 2>/dev/null || true
            MERGE_BASE=$(git merge-base HEAD "$BASE_REF" 2>/dev/null || git merge-base HEAD "origin/$BASE_REF" 2>/dev/null || echo "")
          fi
          if [ -n "$MERGE_BASE" ]; then
            BASE_REV="$MERGE_BASE"
          elif git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
            BASE_REV="$BASE_REF"
          elif git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            BASE_REV="origin/$BASE_REF"
          fi
        fi
        if [ -z "$BASE_REV" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            BASE_REV="HEAD~1"
          fi
        fi
        # The reach map planning reads is the reach store's newest at an ancestor of HEAD: a
        # shallow clone sees too little history to find it, so the pull deepens it (commits only)
        # back to the stored maps' commits, and downloads from the remote tier when there is one.
        # A job handed detect's map (ENACT_REACH_FILE) plans with that one.
        if [ -z "${ENACT_REACH_FILE:-}" ]; then
          enact trace store pull || true
        fi
        # The reach map's footprints are aged by what changed since the revisions they were
        # traced at: fetch those the shallow clone lacks, else each ages whole. Their
        # trees only: aging diffs trees, and reads the few blobs it compares by function lazily.
        MAP_REVISIONS=$(enact trace revisions --missing 2>/dev/null || true)
        if [ -n "$MAP_REVISIONS" ]; then
          MAP_FETCH="git fetch --no-tags --depth=1 --filter=blob:none origin"
          # shellcheck disable=SC2086 # one word per revision
          $MAP_FETCH $MAP_REVISIONS 2>/dev/null || for rev in $MAP_REVISIONS; do
            $MAP_FETCH "$rev" 2>/dev/null || true
          done
        fi
        # Pushes to the default branch record the footprints of the tests they run untraced or
        # stale (`enact run`'s recording, off elsewhere on CI).
        if [ -z "${ENACT_RECORD:-}" ] && [ "$GITHUB_EVENT_NAME" = "push" ] && [ "${GITHUB_REF_NAME:-}" = "${ENACT_DEFAULT_BRANCH:-master}" ]; then
          export ENACT_RECORD=auto
        fi
        # A warm-up (dispatched with warm_reach on the default branch) runs every suite and records
        # every test without a fresh footprint.
        WARM_REACH=""
        if [ "${ENACT_INPUT_WARM_REACH:-}" = "true" ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${GITHUB_REF_NAME:-}" = "${ENACT_DEFAULT_BRANCH:-master}" ]; then
          export ENACT_RECORD=every
          WARM_REACH=1
        fi
        set --
        if [ -n "$BASE_REV" ]; then
          set -- "$@" --base "$BASE_REV"
        fi
        if [ "${ENACT_INPUT_ALL:-}" = "true" ] || [ -n "$WARM_REACH" ]; then
          set -- "$@" --all
        elif [ -n "${ENACT_INPUT_UPDATED:-}" ]; then
          set -- "$@" --updated "$ENACT_INPUT_UPDATED"
        fi
        if [ "${ENACT_FORCE_NO_CACHE:-}" = "true" ]; then
          set -- "$@" --no-cache
        fi
        enact run --pipeline .enact --workflow ci "$@" check-and-lint
      env:
        ENACT_BASE_REF: ${{ inputs.base_ref || github.base_ref || github.event.pull_request.base.ref }}
        ENACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        ENACT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
        ENACT_EVENT_BEFORE: ${{ github.event.before }}
        ENACT_FORCE_NO_CACHE: ${{ inputs.no_cache == 'true' || vars.ENACT_NO_CACHE == 'true' || contains(github.event.pull_request.title, '[no-cache]') || contains(github.event.pull_request.body, '[no-cache]') || contains(github.event.pull_request.labels.*.name, 'no-cache') || contains(github.event.pull_request.labels.*.name, 'showcase') || startsWith(github.head_ref, 'showcase/') || startsWith(github.ref_name, 'showcase/') }}
        ENACT_INPUT_ALL: ${{ inputs.all }}
        ENACT_INPUT_UPDATED: ${{ inputs.updated }}
        ENACT_INPUT_WARM_REACH: ${{ inputs.warm_reach }}
        ENACT_INTEGRATION_BRANCH: ${{ vars.ENACT_INTEGRATION_BRANCH }}
    - parallel:
      - name: Save Cache [node_build]
        if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.cache_node_build.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_node_build.outputs.cache-primary-key }}
          path: .turbo
      - name: Save Cache [vitest_transforms]
        if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.cache_vitest_transforms.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_vitest_transforms.outputs.cache-primary-key }}
          path: node_modules/.vitest-cache
      - name: Save Node dependency cache
