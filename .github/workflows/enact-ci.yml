        ENACT_CONTROL_PIN_REQUIRED: ${{ inputs.control_pin_required }}
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: |-
          .enact
          cue.mod
          .github
          bin
          enve.cue
          enve.lock
          helpers
          patches
          scripts
          package.json
