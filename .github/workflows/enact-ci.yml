        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENACT_UPLOAD_REPORT: ${{ env.ENACT_REMOTE_SAVE_EVENT == 'true' }}
    - name: Upload Master Workflow Dashboard
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-workflow-summary
        path: .enact/state/summary.html
        retention-days: "1"
    - name: Export CI History for All Outcomes
      if: ${{ always() }}
      run: enact ci history export --pipeline "$ENACT_HISTORY_PIPELINE" --input .enact/state/telemetry --output "$RUNNER_TEMP/enact-history-export/snapshot.json"
      env:
        ENACT_HISTORY_PIPELINE: .enact
    - name: Upload Attempt CI History
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: error
        name: enact-history-v1-${{ github.run_attempt }}
        path: ${{ runner.temp }}/enact-history-export/snapshot.json
        retention-days: "14"
    - name: Restore Reach Store
      id: reach-store
      if: ${{ !cancelled() && (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch || github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch) }}
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: enact-reach-${{ github.head_ref || github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .git/enact/reach
        restore-keys: |-
          enact-reach-${{ github.head_ref || github.ref_name }}-${{ github.sha }}-
          enact-reach-${{ github.head_ref || github.ref_name }}-
          enact-reach-${{ github.base_ref || github.event.repository.default_branch }}-
    - name: Download Recorded Footprints
      if: ${{ !cancelled() && (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch || github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch) }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        path: ${{ runner.temp }}/enact-footprints
        pattern: enact-footprints-*
    - name: Consolidate the Reach Map
      id: consolidate_reach
      if: ${{ !cancelled() && (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch || github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch) }}
      run: |-
        cd "${GITHUB_WORKSPACE}"
        if [ -n "$(find "$RUNNER_TEMP/enact-footprints" -name '*.bin' -print -quit 2>/dev/null)" ] || [ "$GITHUB_EVENT_NAME" = push ]; then
          enact reach store pull || true
          enact reach store push --deltas "$RUNNER_TEMP/enact-footprints"
          echo "consolidated=true" >> "$GITHUB_OUTPUT"
        else
          echo "🗺️  Reach store: no deltas to consolidate"
        fi
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENACT_SAME_REPO_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        GITHUB_BASE_REF: ${{ github.base_ref }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    - name: Save Reach Store
      if: ${{ always() && (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch || github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch) && steps.consolidate_reach.outputs.consolidated == 'true' && github.event_name != 'pull_request' }}
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: enact-reach-${{ github.head_ref || github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .git/enact/reach
  test:
    name: Run Tests
    needs:
    - detect
    if: ${{ needs.detect.outputs.matrix != '{"include":[]}' && needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != '' }}
    uses: ./.github/workflows/enact-ci-matrix.yml
    with:
      history_input_artifact: ${{ needs.detect.outputs.history_input_artifact }}
      matrix: ${{ needs.detect.outputs.matrix }}
      warm_reach: ${{ inputs.warm_reach }}
    secrets: inherit
  test-built--n8n-db--build:
    name: Run Tests on Built Outputs
    needs:
    - detect
    - build-outputs--n8n-db--build
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.built__n8n_db__build != '{"include":[]}' && needs.detect.outputs.built__n8n_db__build != '[]' && needs.detect.outputs.built__n8n_db__build != '' }}
    uses: ./.github/workflows/enact-ci-matrix.yml
    with:
      history_input_artifact: ${{ needs.detect.outputs.history_input_artifact }}
      matrix: ${{ needs.detect.outputs.built__n8n_db__build }}
      warm_reach: ${{ inputs.warm_reach }}
    secrets: inherit
  test-built--n8n-db--build-playwright--build:
    name: Run Tests on Built Outputs
    needs:
    - detect
    - build-outputs--n8n-db--build
    - build-outputs-playwright--build
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.built__n8n_db__build_playwright__build != '{"include":[]}' && needs.detect.outputs.built__n8n_db__build_playwright__build != '[]' && needs.detect.outputs.built__n8n_db__build_playwright__build != '' }}
    uses: ./.github/workflows/enact-ci-matrix.yml
    with:
      history_input_artifact: ${{ needs.detect.outputs.history_input_artifact }}
      matrix: ${{ needs.detect.outputs.built__n8n_db__build_playwright__build }}
      warm_reach: ${{ inputs.warm_reach }}
    secrets: inherit
