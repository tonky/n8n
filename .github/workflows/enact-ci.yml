# Generated by enact from .enact; edit the pipeline and run `enact ci generate`.
name: n8n-platform
on:
  push:
    branches:
    - main
    - master
    - perf/ci-modernization
    - perf/ci-showcase
  pull_request:
    branches:
    - main
    - master
    - perf/ci-modernization
    - perf/ci-showcase
    types:
    - opened
    - synchronize
  workflow_dispatch:
    inputs:
      all:
        description: Force execution of all components regardless of git changes
        required: false
        default: "false"
      base_ref:
        description: Target base branch for diff detection (e.g. main, master, a release branch)
        required: false
      files:
        description: File(s) to plan as changed instead of the git diff, comma-separated (e.g. one test file)
        required: false
      force_warm_suites:
        description: Comma-separated <component>:<job> suites forced to re-record all targets during warm_reach=true
        required: false
        default: ""
      no_cache:
        description: Disable task cache, forcing full execution
        required: false
        default: "false"
      seed_caches:
        description: Run the jobs of seeded caches cold and save the caches (on the default branch)
        required: false
        default: "false"
      updated:
        description: Component(s) to emulate as updated
        required: false
      warm_reach:
        description: Run every suite and record each test without a fresh reach footprint (on the default branch, after an enact upgrade)
        required: false
        default: "false"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  ENACT_REMOTE_SAVE_EVENT: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
  ENACT_SAVE_EVENT: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
  ENVE_CACHE_PUBLIC_KEY: enve-r2-1:ckHPTeWVef6mba+1AwWHjKYCsUWKPfP9IXPm5YXNoHg=
  ENVE_SERVICE_GID: "1000"
  ENVE_SERVICE_UID: "1000"
  ENVE_SUBSTITUTERS: https://cache.tonky.dev,https://cache.nixos.org
  ENVE_TRUSTED_PUBLIC_KEYS: enve-r2-1:ckHPTeWVef6mba+1AwWHjKYCsUWKPfP9IXPm5YXNoHg=
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: --max-old-space-size=6144
  UV_CACHE_DIR: /tmp/.cache/uv
  XDG_CACHE_HOME: /tmp/.cache
jobs:
  build-outputs--n8n-db--build:
    permissions:
      actions: read
      contents: read
    name: Build Outputs
    needs:
    - detect
    if: ${{ needs.detect.outputs.builds__n8n_db__build != '{"include":[]}' && needs.detect.outputs.builds__n8n_db__build != '[]' && needs.detect.outputs.builds__n8n_db__build != '' }}
    uses: ./.github/workflows/enact-ci-matrix.yml
    with:
      history_input_artifact: ${{ needs.detect.outputs.history_input_artifact }}
      matrix: ${{ needs.detect.outputs.builds__n8n_db__build }}
      seed_caches: ${{ inputs.seed_caches }}
      warm_reach: ${{ inputs.warm_reach }}
    secrets: inherit
  build-outputs-cli--build:
    permissions:
      actions: read
      contents: read
    name: Build Outputs
    needs:
    - detect
    - build-outputs--n8n-db--build
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.builds_cli__build != '{"include":[]}' && needs.detect.outputs.builds_cli__build != '[]' && needs.detect.outputs.builds_cli__build != '' }}
    uses: ./.github/workflows/enact-ci-matrix.yml
    with:
      history_input_artifact: ${{ needs.detect.outputs.history_input_artifact }}
      matrix: ${{ needs.detect.outputs.builds_cli__build }}
      seed_caches: ${{ inputs.seed_caches }}
      warm_reach: ${{ inputs.warm_reach }}
    secrets: inherit
  build-outputs-playwright--build:
    permissions:
      actions: read
      contents: read
    name: Build Outputs
    needs:
    - detect
    - build-outputs--n8n-db--build
    - build-outputs-cli--build
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.builds_playwright__build != '{"include":[]}' && needs.detect.outputs.builds_playwright__build != '[]' && needs.detect.outputs.builds_playwright__build != '' }}
    uses: ./.github/workflows/enact-ci-matrix.yml
    with:
      history_input_artifact: ${{ needs.detect.outputs.history_input_artifact }}
      matrix: ${{ needs.detect.outputs.builds_playwright__build }}
      seed_caches: ${{ inputs.seed_caches }}
      warm_reach: ${{ inputs.warm_reach }}
    secrets: inherit
  detect:
    name: Detect Affected Components
    env:
      ENACT_OBSERVATIONS_ENABLED: "1"
    permissions:
      actions: read
      contents: read
    runs-on:
    - self-hosted
    - Linux
    - tonky-ci
    - tonky-ci-c2m4g
    timeout-minutes: 5
    outputs:
      builds__n8n_db__build: ${{ steps.diff.outputs.builds__n8n_db__build }}
      builds_cli__build: ${{ steps.diff.outputs.builds_cli__build }}
      builds_playwright__build: ${{ steps.diff.outputs.builds_playwright__build }}
      built__n8n_db__build_cli__build: ${{ steps.diff.outputs.built__n8n_db__build_cli__build }}
      built__n8n_db__build_cli__build_playwright__build: ${{ steps.diff.outputs.built__n8n_db__build_cli__build_playwright__build }}
      history_input_artifact: ${{ steps.history_restore.outputs.artifact }}
      matrix: ${{ steps.diff.outputs.matrix }}
    steps:
    - name: Probe Runner Caches
      id: runner_caches
      run: |
        set -euo pipefail
        host="${ENACT_HOST_CACHE:-}"
        if [ -n "$host" ] && ! { [ -d "$host/repo" ] && [ -w "$host/repo" ]; }; then
            echo "::warning::ENACT_HOST_CACHE=$host has no writable repo/ directory; using GitHub's cache"
            host=""
        fi
        if [ -n "$host" ]; then
            mkdir -p "$host/repo/git" "$host/repo/outputs"
            echo "ENACT_GIT_MIRROR=$host/repo/git/${GITHUB_REPOSITORY##*/}.git" >> "$GITHUB_ENV"
            echo "ENACT_OUTPUTS_CACHE=$host/repo/outputs" >> "$GITHUB_ENV"
        fi
        echo "ENACT_HOST_CACHE=$host" >> "$GITHUB_ENV"
        printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
        printf 'Host cache: %s\n' "${host:-none}"
    - name: Checkout Repository (sparse) from the Host Mirror
      id: host_checkout
      if: ${{ steps.runner_caches.outputs.host != '' }}
      continue-on-error: true
      run: |
        set -euo pipefail
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        mirror="$ENACT_GIT_MIRROR"
        export GIT_CONFIG_COUNT=2
        export GIT_CONFIG_KEY_0=safe.directory
        export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
        export GIT_CONFIG_KEY_1=safe.directory
        export GIT_CONFIG_VALUE_1="$mirror"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        refs=("+refs/heads/*:refs/heads/*")
        case "$GITHUB_REF" in
            refs/pull/*) refs+=("+$GITHUB_REF:$GITHUB_REF") ;;
        esac
        (
            flock 9
            if [ ! -f "$mirror/HEAD" ]; then
                git init -q --bare "$mirror"
                git -C "$mirror" config uploadpack.allowAnySHA1InWant true
                git -C "$mirror" config gc.auto 0
            fi
            ref_current=""
            case "$GITHUB_REF" in
                refs/heads/*|refs/pull/*) ref_current=$(git -C "$mirror" rev-parse --verify -q "$GITHUB_REF^{commit}" 2>/dev/null || true) ;;
                *) ref_current="$GITHUB_SHA" ;;
            esac
            if [ -z "$(find "$mirror/HEAD" -mmin -1 2>/dev/null || true)" ] || [ "$ref_current" != "$GITHUB_SHA" ] || ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags --prune "$url" "${refs[@]}"
                if ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags "$url" "$GITHUB_SHA"
                fi
            fi
            touch "$mirror" "$mirror/HEAD" 2>/dev/null || true
        ) 9>"$mirror.lock"
        cd "$GITHUB_WORKSPACE"
        trap 'rm -rf "$GITHUB_WORKSPACE/.git"' ERR
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        echo "$mirror/objects" > .git/objects/info/alternates
        [ ! -f "$mirror/shallow" ] || cp "$mirror/shallow" .git/shallow
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local gc.auto 0
        git fetch -q --no-tags "$mirror" "+refs/heads/*:refs/remotes/origin/*"
        if [ -n "${ENACT_SPARSE_CONE:-}" ]; then
            mapfile -t raw_cone < <(printf '%s\n' "$ENACT_SPARSE_CONE" | sed '/^[[:space:]]*$/d')
            cone=()
            for entry in "${raw_cone[@]}"; do
                case "$entry" in
                    */.enact-direct-files)
                        cone+=("$entry")
                        ;;
                    *)
                        kind=$(git cat-file -t "$GITHUB_SHA:$entry" 2>/dev/null || true)
                        if [ "$kind" = "blob" ]; then
                            case "$entry" in
                                */*) cone+=("${entry%/*}/.enact-direct-files") ;;
                            esac
                        else
                            cone+=("$entry")
                        fi
                        ;;
                esac
            done
            if [ "${#cone[@]}" -gt 0 ]; then
                git sparse-checkout set --cone "${cone[@]}"
            fi
        fi
        case "$GITHUB_REF" in
            refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$GITHUB_SHA" ;;
            *) git checkout -q --force --detach "$GITHUB_SHA" ;;
        esac
        git log -1 --format='Checked out %H through the host mirror'
      env:
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: |-
          .enact
          cue.mod
          .github
          bin
          enve.cue
          enve.lock
          helpers
          patches
          scripts
          package.json
          pnpm-lock.yaml
          pnpm-workspace.yaml
          turbo.json
          tsconfig.json
          tsconfig.configs.json
          biome.jsonc
          vitest.workspace.ts
          .prettierrc.js
          .prettierignore
          .boundaries-baseline.json
          packages/@n8n/eslint-plugin-community-nodes
          packages/@n8n/module-cli
          packages/@n8n/typescript-config
    - name: Checkout Repository (sparse)
      id: sparse_checkout
      if: ${{ steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure' }}
      run: |
        set -euo pipefail
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0=safe.directory
        export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        cd "$GITHUB_WORKSPACE"
        # shellcheck disable=SC2015
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local protocol.version 2
        git config --local fetch.parallel 0
        git config --local checkout.workers 0
        git config --local index.threads 0
        git config --local advice.detachedHead false
        git config --local gc.auto 0
        cone=()
        while IFS= read -r entry; do
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            [ -n "$entry" ] && cone+=("$entry")
        done <<<"${ENACT_SPARSE_CONE:-}"
        depth="${ENACT_FETCH_DEPTH:-1}"
        fetch_args=(--no-tags --no-recurse-submodules)
        if [ "$depth" != "0" ]; then
            fetch_args+=("--depth=$depth")
        fi
        narrow_cone=0
        if [ "${#cone[@]}" -gt 0 ] && [ "${#cone[@]}" -le 8 ]; then
            narrow_cone=1
            for entry in "${cone[@]}"; do
                case "$entry" in
                    . | ./ | .. | ../*)
                        narrow_cone=0
                        break
                        ;;
                    .* | cue.mod | cue.mod/* | bin | bin/* | */*)
                        ;;
                    *)
                        narrow_cone=0
                        break
                        ;;
                esac
            done
        fi
        if [ "$narrow_cone" = 1 ]; then
            fetch_args+=(--filter=blob:none)
        fi
        git fetch -q "${fetch_args[@]}" origin "$GITHUB_SHA" 2>/dev/null \
            || git fetch -q "${fetch_args[@]}" origin "$GITHUB_REF"
        if [ "${#cone[@]}" -gt 0 ]; then
            normalized=()
            for entry in "${cone[@]}"; do
                case "$entry" in
                    */.enact-direct-files)
                        normalized+=("$entry")
                        ;;
                    *)
                        kind=$(git cat-file -t "$GITHUB_SHA:$entry" 2>/dev/null || true)
                        if [ "$kind" = "blob" ]; then
                            case "$entry" in
                                */*) normalized+=("${entry%/*}/.enact-direct-files") ;;
                            esac
                        else
                            normalized+=("$entry")
                        fi
                        ;;
                esac
            done
            if [ "${#normalized[@]}" -gt 0 ]; then
                git sparse-checkout set --cone "${normalized[@]}"
            fi
        fi
        case "$GITHUB_REF" in
            refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$GITHUB_SHA" ;;
            *) git checkout -q --force --detach "$GITHUB_SHA" ;;
        esac
        git log -1 --format='Checked out %H (shallow sparse)'
      env:
        ENACT_FETCH_DEPTH: "1"
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: |-
          .enact
          cue.mod
          .github
          bin
          enve.cue
          enve.lock
          helpers
          patches
          scripts
          package.json
          pnpm-lock.yaml
          pnpm-workspace.yaml
          turbo.json
          tsconfig.json
          tsconfig.configs.json
          biome.jsonc
          vitest.workspace.ts
          .prettierrc.js
          .prettierignore
          .boundaries-baseline.json
          packages/@n8n/eslint-plugin-community-nodes
          packages/@n8n/module-cli
          packages/@n8n/typescript-config
    - name: Restore Reach Store
      id: reach-store
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: enact-reach-${{ github.head_ref || github.ref_name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .git/enact/reach
        restore-keys: |-
          enact-reach-${{ github.head_ref || github.ref_name }}-${{ github.sha }}-
          enact-reach-${{ github.head_ref || github.ref_name }}-
          enact-reach-${{ github.base_ref || github.event.repository.default_branch }}-
    - name: Install committed enact & enve builds
      run: |
        P="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        E="${GITHUB_WORKSPACE:-$PWD}/bin/$P/enact"
        [ -f "$E" ] || E="${GITHUB_WORKSPACE:-$PWD}/bin/enact"
        [ -f "$E" ] || E="$(command -v enact || echo "$HOME/.cargo/bin/enact")"
        chmod +x "$E" 2>/dev/null || true
        "$E" --version >/dev/null 2>&1 || { echo "::error title=No enact for $P::$E does not run on this $P runner; commit its build as bin/$P/enact"; exit 1; }
        "$E" ci install-binaries
    - name: Ensure enve & enact CLI on PATH
      id: setup-runner
      run: enact ci setup-runner
    - name: Select Immutable CI History
      id: history_restore
      run: |-
        enact ci history restore --pipeline "$ENACT_HISTORY_PIPELINE" --repo "$GITHUB_REPOSITORY" --workflow "$ENACT_HISTORY_WORKFLOW" --head "$ENACT_HISTORY_HEAD" --output "$RUNNER_TEMP/enact-history-input/snapshot.json" --max-runs 8 --max-age-days 14 --max-bytes 4194304
        export ENACT_HISTORY_DIR="$RUNNER_TEMP/enact-history"
        printf 'ENACT_HISTORY_DIR=%s\n' "$ENACT_HISTORY_DIR" >> "$GITHUB_ENV"
        enact ci history import --input "$RUNNER_TEMP/enact-history-input/snapshot.json" --manifest "$RUNNER_TEMP/enact-history-input/snapshot.manifest.json" --output "$ENACT_HISTORY_DIR"
        printf 'artifact=enact-history-input-v1-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      env:
        ENACT_HISTORY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        ENACT_HISTORY_PIPELINE: .enact
        ENACT_HISTORY_WORKFLOW: .github/workflows/enact-ci.yml
        GH_TOKEN: ${{ github.token }}
    - name: Cache history Handoff on the Receiving Host
      if: env.ENACT_HOST_CACHE != ''
      continue-on-error: true
      run: enact ci handoff history --publish --artifact "$ENACT_HANDOFF_ARTIFACT" --directory "$RUNNER_TEMP/enact-history-input"
      env:
        ENACT_HANDOFF_ARTIFACT: enact-history-input-v1-${{ github.run_attempt }}
    - name: Hand CI History to the Jobs
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: error
        name: enact-history-input-v1-${{ github.run_attempt }}
        path: |-
          ${{ runner.temp }}/enact-history-input/snapshot.json
          ${{ runner.temp }}/enact-history-input/snapshot.manifest.json
        retention-days: "14"
    - name: Compute Affected Component Matrix
      id: diff
      run: |-
        if [ -n "${GITHUB_WORKSPACE}" ] && [ -d "${GITHUB_WORKSPACE}" ]; then
          cd "${GITHUB_WORKSPACE}"
        fi
        RESOLVED=$(enact ci resolve-base) || exit
        eval "$RESOLVED"
        ADMISSION_REPORT="$RUNNER_TEMP/enact-admission.json"
        MATRIX=$(enact ci matrix --pipeline .enact --workflow ci --github-output "$GITHUB_OUTPUT" --reach-hand-off "$RUNNER_TEMP/enact-reach" --selection-record .enact/state/selection.json --shard-manifest "$RUNNER_TEMP/enact-shard-manifest" --budget --budget-report "$ADMISSION_REPORT" "$@" --format json) || {
          status=$?
          if [ "$status" -ge 128 ]; then
            echo "::error::enact ci matrix terminated by signal/OOM (exit $status)" >&2
          else
            echo "::error::CI budget admission failed; report: $ADMISSION_REPORT" >&2
          fi
          exit "$status"
        }
        echo "$MATRIX"
        echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_BASE_REF: ${{ inputs.base_ref || github.base_ref || github.event.pull_request.base.ref }}
        ENACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        ENACT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
        ENACT_DETECT_OTHER_OUTPUTS: ${{ format('{{"history_input_artifact":{0}}}', toJSON(steps.history_restore.outputs.artifact)) }}
        ENACT_EVENT_BEFORE: ${{ github.event.before }}
        ENACT_FORCE_NO_CACHE: ${{ inputs.no_cache == 'true' || vars.ENACT_NO_CACHE == 'true' || contains(github.event.pull_request.title, '[no-cache]') || contains(github.event.pull_request.body, '[no-cache]') || contains(github.event.pull_request.labels.*.name, 'no-cache') }}
        ENACT_FORCE_RERUN: ${{ contains(github.event.pull_request.title, '[rerun]') || contains(github.event.pull_request.body, '[rerun]') || contains(github.event.pull_request.labels.*.name, 'rerun') || contains(github.event.pull_request.labels.*.name, 'showcase') || startsWith(github.head_ref, 'proof/') || startsWith(github.ref_name, 'proof/') || startsWith(github.head_ref, 'showcase/proof/') || startsWith(github.ref_name, 'showcase/proof/') }}
        ENACT_INPUT_ALL: ${{ inputs.all }}
        ENACT_INPUT_FILES: ${{ inputs.files }}
        ENACT_INPUT_FORCE_WARM_SUITES: ${{ inputs.force_warm_suites }}
        ENACT_INPUT_SEED_CACHES: ${{ inputs.seed_caches }}
        ENACT_INPUT_UPDATED: ${{ inputs.updated }}
        ENACT_INPUT_WARM_REACH: ${{ inputs.warm_reach }}
        ENACT_INTEGRATION_BRANCH: ${{ vars.ENACT_INTEGRATION_BRANCH }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENACT_RECORD: ${{ (github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch) && 'every' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch) && 'auto' || 'off' }}
        ENACT_SAME_REPO_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: safe.directory
        GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    - name: Upload the Selection Record
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-selection
        path: .enact/state/selection.json
        retention-days: "30"
    - name: Cache Shard Manifest Handoff on the Receiving Host
      if: env.ENACT_HOST_CACHE != ''
      continue-on-error: true
      run: |-
        if [ -f "$RUNNER_TEMP/enact-shard-manifest/manifest.json" ]; then
          enact ci handoff shard-manifest --publish --artifact "$ENACT_HANDOFF_ARTIFACT" --directory "$RUNNER_TEMP/enact-shard-manifest"
        fi
      env:
        ENACT_HANDOFF_ARTIFACT: enact-shard-manifest
    - name: Hand the Frozen Shard Manifest to the Jobs
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-shard-manifest
        path: ${{ runner.temp }}/enact-shard-manifest
        retention-days: "30"
    - name: Cache reach Handoff on the Receiving Host
      if: env.ENACT_HOST_CACHE != ''
      continue-on-error: true
      run: enact ci handoff reach --publish --artifact "$ENACT_HANDOFF_ARTIFACT" --directory "$RUNNER_TEMP/enact-reach"
      env:
        ENACT_HANDOFF_ARTIFACT: enact-reach-map
    - name: Hand the Reach Map to the Jobs
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-reach-map
        path: ${{ runner.temp }}/enact-reach
        retention-days: "1"
  summary:
    name: Consolidate Reach Map & Telemetry
    env:
      ENACT_OBSERVATIONS_ENABLED: "1"
    needs:
    - detect
    - test
    - build-outputs--n8n-db--build
    - build-outputs-cli--build
    - build-outputs-playwright--build
    - test-built--n8n-db--build-cli--build
    - test-built--n8n-db--build-cli--build-playwright--build
    if: "!cancelled()"
    runs-on:
    - self-hosted
    - Linux
    - tonky-ci
    - tonky-ci-c2m4g
    timeout-minutes: 15
    steps:
    - name: Probe Runner Caches
      id: runner_caches
      run: |
        set -euo pipefail
        host="${ENACT_HOST_CACHE:-}"
        if [ -n "$host" ] && ! { [ -d "$host/repo" ] && [ -w "$host/repo" ]; }; then
            echo "::warning::ENACT_HOST_CACHE=$host has no writable repo/ directory; using GitHub's cache"
            host=""
        fi
        if [ -n "$host" ]; then
            mkdir -p "$host/repo/git" "$host/repo/outputs"
            echo "ENACT_GIT_MIRROR=$host/repo/git/${GITHUB_REPOSITORY##*/}.git" >> "$GITHUB_ENV"
            echo "ENACT_OUTPUTS_CACHE=$host/repo/outputs" >> "$GITHUB_ENV"
        fi
        echo "ENACT_HOST_CACHE=$host" >> "$GITHUB_ENV"
        printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
        printf 'Host cache: %s\n' "${host:-none}"
    - name: Checkout Repository (sparse) from the Host Mirror
      id: host_checkout
      if: ${{ steps.runner_caches.outputs.host != '' }}
      continue-on-error: true
      run: |
        set -euo pipefail
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        mirror="$ENACT_GIT_MIRROR"
        export GIT_CONFIG_COUNT=2
        export GIT_CONFIG_KEY_0=safe.directory
        export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
        export GIT_CONFIG_KEY_1=safe.directory
        export GIT_CONFIG_VALUE_1="$mirror"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        refs=("+refs/heads/*:refs/heads/*")
        case "$GITHUB_REF" in
            refs/pull/*) refs+=("+$GITHUB_REF:$GITHUB_REF") ;;
        esac
        (
            flock 9
            if [ ! -f "$mirror/HEAD" ]; then
                git init -q --bare "$mirror"
                git -C "$mirror" config uploadpack.allowAnySHA1InWant true
                git -C "$mirror" config gc.auto 0
            fi
            ref_current=""
            case "$GITHUB_REF" in
                refs/heads/*|refs/pull/*) ref_current=$(git -C "$mirror" rev-parse --verify -q "$GITHUB_REF^{commit}" 2>/dev/null || true) ;;
                *) ref_current="$GITHUB_SHA" ;;
            esac
            if [ -z "$(find "$mirror/HEAD" -mmin -1 2>/dev/null || true)" ] || [ "$ref_current" != "$GITHUB_SHA" ] || ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags --prune "$url" "${refs[@]}"
                if ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags "$url" "$GITHUB_SHA"
                fi
            fi
            touch "$mirror" "$mirror/HEAD" 2>/dev/null || true
        ) 9>"$mirror.lock"
        cd "$GITHUB_WORKSPACE"
        trap 'rm -rf "$GITHUB_WORKSPACE/.git"' ERR
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        echo "$mirror/objects" > .git/objects/info/alternates
        [ ! -f "$mirror/shallow" ] || cp "$mirror/shallow" .git/shallow
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local gc.auto 0
        git fetch -q --no-tags "$mirror" "+refs/heads/*:refs/remotes/origin/*"
        if [ -n "${ENACT_SPARSE_CONE:-}" ]; then
            mapfile -t raw_cone < <(printf '%s\n' "$ENACT_SPARSE_CONE" | sed '/^[[:space:]]*$/d')
            cone=()
            for entry in "${raw_cone[@]}"; do
                case "$entry" in
                    */.enact-direct-files)
                        cone+=("$entry")
                        ;;
                    *)
                        kind=$(git cat-file -t "$GITHUB_SHA:$entry" 2>/dev/null || true)
                        if [ "$kind" = "blob" ]; then
                            case "$entry" in
                                */*) cone+=("${entry%/*}/.enact-direct-files") ;;
                            esac
                        else
                            cone+=("$entry")
                        fi
                        ;;
                esac
            done
            if [ "${#cone[@]}" -gt 0 ]; then
                git sparse-checkout set --cone "${cone[@]}"
            fi
        fi
        case "$GITHUB_REF" in
            refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$GITHUB_SHA" ;;
            *) git checkout -q --force --detach "$GITHUB_SHA" ;;
        esac
        git log -1 --format='Checked out %H through the host mirror'
      env:
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: |-
          .enact
          cue.mod
          .github
          bin
    - name: Checkout Repository (sparse)
      id: sparse_checkout
      if: ${{ steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure' }}
      run: |
        set -euo pipefail
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        export GIT_CONFIG_COUNT=1
        export GIT_CONFIG_KEY_0=safe.directory
        export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        cd "$GITHUB_WORKSPACE"
        # shellcheck disable=SC2015
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local protocol.version 2
        git config --local fetch.parallel 0
        git config --local checkout.workers 0
        git config --local index.threads 0
        git config --local advice.detachedHead false
        git config --local gc.auto 0
        cone=()
        while IFS= read -r entry; do
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            [ -n "$entry" ] && cone+=("$entry")
        done <<<"${ENACT_SPARSE_CONE:-}"
        depth="${ENACT_FETCH_DEPTH:-1}"
        fetch_args=(--no-tags --no-recurse-submodules)
        if [ "$depth" != "0" ]; then
            fetch_args+=("--depth=$depth")
        fi
        narrow_cone=0
        if [ "${#cone[@]}" -gt 0 ] && [ "${#cone[@]}" -le 8 ]; then
            narrow_cone=1
            for entry in "${cone[@]}"; do
                case "$entry" in
                    . | ./ | .. | ../*)
                        narrow_cone=0
                        break
                        ;;
                    .* | cue.mod | cue.mod/* | bin | bin/* | */*)
                        ;;
                    *)
                        narrow_cone=0
                        break
                        ;;
                esac
            done
        fi
        if [ "$narrow_cone" = 1 ]; then
            fetch_args+=(--filter=blob:none)
        fi
        git fetch -q "${fetch_args[@]}" origin "$GITHUB_SHA" 2>/dev/null \
            || git fetch -q "${fetch_args[@]}" origin "$GITHUB_REF"
        if [ "${#cone[@]}" -gt 0 ]; then
            normalized=()
            for entry in "${cone[@]}"; do
                case "$entry" in
                    */.enact-direct-files)
                        normalized+=("$entry")
                        ;;
                    *)
                        kind=$(git cat-file -t "$GITHUB_SHA:$entry" 2>/dev/null || true)
                        if [ "$kind" = "blob" ]; then
                            case "$entry" in
                                */*) normalized+=("${entry%/*}/.enact-direct-files") ;;
                            esac
                        else
                            normalized+=("$entry")
                        fi
                        ;;
                esac
            done
            if [ "${#normalized[@]}" -gt 0 ]; then
                git sparse-checkout set --cone "${normalized[@]}"
            fi
        fi
