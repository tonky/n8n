    if: ${{ !cancelled() && needs.detect.result == 'success' && needs.build-outputs--n8n-db--build.result != 'failure' && needs.build-outputs--n8n-db--build.result != 'cancelled' && needs.detect.outputs.builds_cli__build != '{"include":[]}' && needs.detect.outputs.builds_cli__build != '[]' && needs.detect.outputs.builds_cli__build != '' && needs.lookup-outputs-cli--build.outputs.hit != 'true' }}
