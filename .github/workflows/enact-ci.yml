          HANDOFF_DEST="$HANDOFF_ROOT/${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-1}"
          HANDOFF_TMP="$HANDOFF_DEST.tmp.$$"
          mkdir -p "$HANDOFF_ROOT" && rm -rf "$HANDOFF_TMP"
          if cp -a --reflink=auto "$RUNNER_TEMP/enact-reach" "$HANDOFF_TMP" 2>/dev/null || cp -R "$RUNNER_TEMP/enact-reach" "$HANDOFF_TMP"; then
