        git config --global --add safe.directory "*" 2>/dev/null || true
        mkdir -p "$HOME/.local/share/enve/store"
        if command -v sudo >/dev/null 2>&1; then
          sudo mkdir -p -m 0755 /nix 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" /nix 2>/dev/null || true
        fi
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
        fi
        # The previous step's $GITHUB_PATH entries apply from the next step on.
        export PATH="$HOME/.cargo/bin:${GITHUB_WORKSPACE:-$PWD}/bin:$PATH"
        # Isolation as on a Linux workstation: with bubblewrap on PATH (e.g. the repository's
        # bin/bwrap), enve sandboxes commands and services and maps the profile's hosts inside.
        # GitHub's Ubuntu runners restrict unprivileged user namespaces (AppArmor), which bwrap
        # needs; the VM is disposable, so lift that. Without a working bwrap, enve runs on the host:
        # its profile's host aliases go to the runner's /etc/hosts instead.
        if command -v bwrap >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 \
          && [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        fi
        if command -v bwrap >/dev/null 2>&1 && bwrap --bind / / true 2>/dev/null; then
          echo "enve isolation: $(bwrap --version)"
        elif command -v sudo >/dev/null 2>&1 && command -v enve >/dev/null 2>&1 && [ -f enve.cue ]; then
          enve cue export -q -e profiles.dev.hosts enve.cue 2>/dev/null \
            | jq -r 'to_entries[] | "\(.value) \(.key)"' 2>/dev/null \
            | sudo tee -a /etc/hosts >/dev/null || true
        fi
    - name: Download All Component Telemetry
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        path: .enact/state/telemetry
        pattern: telemetry-*
    - name: Generate Consolidated Telemetry Summary
      continue-on-error: true
      run: enact report --dir .enact/state/telemetry
    - name: Upload Master Workflow Dashboard
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-workflow-summary
        path: .enact/state/summary.html
        retention-days: "1"
  test:
    name: Run Tests (${{ matrix.component }})
    needs:
    - detect
    if: ${{ needs.detect.outputs.matrix != '{"include":[]}' && needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 15
    steps:
    - name: Checkout Repository (sparse)
      if: ${{ matrix.sparse_checkout != '' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        sparse-checkout: ${{ matrix.sparse_checkout }}
        sparse-checkout-cone-mode: "true"
        submodules: "false"
    - name: Checkout Repository (full)
      if: ${{ matrix.sparse_checkout == '' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        submodules: "false"
    - name: Install committed enact & enve builds
      run: |
        # The repository's committed enact, enve and bubblewrap builds: bin/<os>-<arch>/ for this runner
        # (bin/linux-x86_64/, bin/linux-aarch64/), else bin/. They're copied to ~/.cargo/bin,
        # which goes ahead of bin/ on PATH, so the runner's own build wins over bin/'s. A build for
        # another CPU (an x86_64 enve on an arm64 runner) is never installed: enact or enve fails
        # here, naming the directory to commit, instead of the first step that runs it.
        BIN_DIR="${GITHUB_WORKSPACE:-$PWD}/bin"
        PLATFORM="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        # Whether this runner can execute $1: false only for an ELF of another CPU or OS.
        runs_here() {
          local header
          header="$(od -An -tx1 -N20 "$1" 2>/dev/null | tr -d ' \n')"
          [ "${header:0:8}" = 7f454c46 ] || return 0
          case "$PLATFORM:${header:36:4}" in
            linux-x86_64:3e00 | linux-aarch64:b700) return 0 ;;
          esac
          return 1
        }
        mkdir -p "$HOME/.cargo/bin"
        if [ -d "$BIN_DIR" ]; then
          for b in enact enve bwrap; do
            src="$BIN_DIR/$b"
            if [ -f "$BIN_DIR/$PLATFORM/$b" ]; then
              src="$BIN_DIR/$PLATFORM/$b"
            fi
            [ -f "$src" ] || continue
            if ! runs_here "$src"; then
              if [ "$b" = bwrap ]; then
                echo "::warning::bin/$b is a build for another CPU than this $PLATFORM runner: not installed"
                continue
              fi
              echo "::error title=No $b for $PLATFORM::bin/$b is a build for another CPU; commit this runner's as bin/$PLATFORM/$b"
              exit 1
            fi
            chmod +x "$src" 2>/dev/null || true
            cp -f "$src" "$HOME/.cargo/bin/$b"
          done
          echo "$BIN_DIR" >> "$GITHUB_PATH"
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Ensure enve & enact CLI on PATH
      run: |
        git config --global --add safe.directory "*" 2>/dev/null || true
        mkdir -p "$HOME/.local/share/enve/store"
        if command -v sudo >/dev/null 2>&1; then
          sudo mkdir -p -m 0755 /nix 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" /nix 2>/dev/null || true
        fi
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
        fi
        # The previous step's $GITHUB_PATH entries apply from the next step on.
        export PATH="$HOME/.cargo/bin:${GITHUB_WORKSPACE:-$PWD}/bin:$PATH"
        # Isolation as on a Linux workstation: with bubblewrap on PATH (e.g. the repository's
        # bin/bwrap), enve sandboxes commands and services and maps the profile's hosts inside.
        # GitHub's Ubuntu runners restrict unprivileged user namespaces (AppArmor), which bwrap
        # needs; the VM is disposable, so lift that. Without a working bwrap, enve runs on the host:
        # its profile's host aliases go to the runner's /etc/hosts instead.
        if command -v bwrap >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 \
          && [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        fi
        if command -v bwrap >/dev/null 2>&1 && bwrap --bind / / true 2>/dev/null; then
          echo "enve isolation: $(bwrap --version)"
        elif command -v sudo >/dev/null 2>&1 && command -v enve >/dev/null 2>&1 && [ -f enve.cue ]; then
          enve cue export -q -e profiles.dev.hosts enve.cue 2>/dev/null \
            | jq -r 'to_entries[] | "\(.value) \(.key)"' 2>/dev/null \
            | sudo tee -a /etc/hosts >/dev/null || true
        fi
    - name: Probe existing locked enve store
      id: enve_store_ready
      run: |
        #!/usr/bin/env bash
        # Readiness is an offline locked runtime check, never a fabricated archive hit.
        set -euo pipefail
        ready=false
        probe() {
            ENVE_OFFLINE=1 timeout --kill-after=2s 8s enve run --locked -- true >/dev/null 2>&1
        }
        if [ -f enve.lock ] && command -v timeout >/dev/null && command -v enve >/dev/null && probe; then
            ready=true
            component="${ENACT_COMPONENT_DIR:-.}"
            if [ "$component" != . ] && [ -n "$component" ]; then
                if [ ! -d "$component" ]; then
                    ready=false
                elif [ -f "$component/enve.lock" ] && ! (cd -- "$component" && probe); then
                    ready=false
                fi
            fi
        fi
        printf 'ready=%s\n' "$ready" >> "$GITHUB_OUTPUT"
        printf 'Existing locked enve environment ready: %s\n' "$ready"
      env:
        ENACT_COMPONENT_DIR: ${{ matrix.component_dir }}
    - parallel:
      - name: Restore enact Task CAS Cache
        id: enact-tasks-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-enact-tasks-${{ github.sha }}
          path: .enact/state/cache
          restore-keys: ${{ runner.os }}-enact-tasks-
      - name: Restore Python build & venv cache
        id: python_l1_cache
        if: hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') != '' && contains(matrix.technology, 'python') && vars.ENACT_UV_CACHE_DIR == ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-python-${{ hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') }}
          path: |-
            ${{ env.UV_CACHE_DIR }}
            /tmp/.cache/pip
          restore-keys: ${{ runner.os }}-python-
      - name: Restore Go build cache
        id: go_l1_cache
        if: hashFiles('**/go.mod', '**/go.sum') != '' && contains(matrix.technology, 'go')
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.mod', '**/go.sum') }}-${{ github.sha }}
          path: |-
            /tmp/go-build
            /tmp/go/pkg/mod
          restore-keys: |-
            ${{ runner.os }}-go-${{ hashFiles('**/go.mod', '**/go.sum') }}-
            ${{ runner.os }}-go-
      - name: Restore Node dependency cache
        id: node_l1_cache
        if: contains(matrix.technology, 'typescript') || contains(matrix.technology, 'javascript') || contains(matrix.technology, 'node')
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-node-v2-${{ matrix.task_id }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'enve.lock', 'pnpm-workspace.yaml') }}
          path: |-
            .enact/state/pnpm-store
            node_modules/.cache
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node-v2-${{ matrix.task_id }}-
      - name: Restore Cache [node_build]
        id: cache_node_build
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: node_build-${{ runner.os }}-${{ matrix.task_id }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          path: .turbo
          restore-keys: node_build-${{ runner.os }}-${{ matrix.task_id }}-
      - name: Restore Cache [vitest_transforms]
        id: cache_vitest_transforms
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: vitest_transforms-${{ runner.os }}-${{ matrix.task_id }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: node_modules/.vitest-cache
          restore-keys: vitest_transforms-${{ runner.os }}-${{ matrix.task_id }}-
      - name: Restore enve Store (L1 GHA Cache)
        id: nix_l1_cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-enve-store-v2-${{ hashFiles('**/enve.lock') }}
          lookup-only: ${{ steps.enve_store_ready.outputs.ready == 'true' }}
          path: ~/.local/share/enve/store
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-enve-store-v2-
    - name: Restore Browsers [chromium]
      id: browsers_l1_cache
      if: matrix.browsers
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-browsers-chromium-${{ hashFiles('packages/quality/testing/playwright/package.json', 'pnpm-lock.yaml') }}
        path: /tmp/.cache/ms-playwright
    - name: Provision Browsers [chromium]
      if: matrix.browsers
      continue-on-error: true
      run: |-
        set -o pipefail
        BROWSERS_PATH="${ENACT_BROWSERS_PATH/#\~/$HOME}"
        mkdir -p "$BROWSERS_PATH"
        if [ -n "${ENACT_BROWSERS_ENV:-}" ]; then
          echo "$ENACT_BROWSERS_ENV=$BROWSERS_PATH" >> "$GITHUB_ENV"
        fi
      env:
        ENACT_BROWSERS_ENV: PLAYWRIGHT_BROWSERS_PATH
        ENACT_BROWSERS_PATH: /tmp/.cache/ms-playwright
    - name: Download the Reach Map
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: enact-reach-map
        path: ${{ runner.temp }}/enact-reach
    - name: Plan with the Detected Reach Map
      run: |-
        if [ -f "$RUNNER_TEMP/enact-reach/map.bin" ]; then
          echo "ENACT_REACH_FILE=$RUNNER_TEMP/enact-reach/map.bin" >> "$GITHUB_ENV"
        fi
    - name: Pull Dependencies via enve
      run: |-
        if [ -d "/nix" ]; then
          if [ -d "/nix/store" ] && [ ! -L "/nix/store" ]; then
            cp -rn /nix/store/* "$HOME/.local/share/enve/store/" 2>/dev/null || true
            rm -rf /nix/store 2>/dev/null || true
          fi
          ln -sfn "$HOME/.local/share/enve/store" /nix/store 2>/dev/null || true
        fi
        if [ -f "enve.lock" ]; then
          enve run --locked -- true
        fi
        if [ -n "$ENACT_COMPONENT_DIR" ] && [ "$ENACT_COMPONENT_DIR" != "." ] && [ -f "$ENACT_COMPONENT_DIR/enve.lock" ]; then
          (cd "$ENACT_COMPONENT_DIR" && enve run --locked -- true)
        fi
      env:
        ENACT_COMPONENT_DIR: ${{ matrix.component_dir }}
    - name: Install Project Dependencies
      if: hashFiles('package.json') != '' && (contains(matrix.technology, 'typescript') || contains(matrix.technology, 'javascript') || contains(matrix.technology, 'node'))
      run: |-
        RUN_PREFIX=""
        if command -v enve >/dev/null 2>&1 && [ -f "enve.lock" ]; then
          RUN_PREFIX="enve run --locked -- "
        fi
        set -f
        for arg in ${ENACT_MATRIX_FILTER_ARGS:-}; do set -- "$@" "$arg"; done
        set +f
        echo "📦 Installing project dependencies..."
        ENACT_INSTALL_INPUTS=$(mktemp "$RUNNER_TEMP/enact-install-inputs.XXXXXX")
        sha256sum pnpm-lock.yaml > "$ENACT_INSTALL_INPUTS"
        for input in package.json pnpm-workspace.yaml enve.lock; do
          if [ -f "$input" ]; then sha256sum "$input" >> "$ENACT_INSTALL_INPUTS"; fi
        done
        $RUN_PREFIX pnpm install "$@" --frozen-lockfile --store-dir "$PWD/.enact/state/pnpm-store" --offline --config.audit=false --config.minimum-release-age=0 --config.package-import-method=hardlink --config.fetch-retries=2 --config.fetch-retry-maxtimeout=10000 --network-concurrency=16 ||
          $RUN_PREFIX pnpm install "$@" --frozen-lockfile --store-dir "$PWD/.enact/state/pnpm-store" --prefer-offline --config.audit=false --config.minimum-release-age=0 --config.package-import-method=hardlink --config.fetch-retries=2 --config.fetch-retry-maxtimeout=10000 --network-concurrency=16 || exit $?
        sha256sum --check "$ENACT_INSTALL_INPUTS"
        rm "$ENACT_INSTALL_INPUTS"
        echo "ENACT_PREPARED=${ENACT_PREPARED:+$ENACT_PREPARED,}node" >> "$GITHUB_ENV"
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        ENACT_MATRIX_FILTER_ARGS: ${{ matrix.filter_args }}
        GITHUB_TOKEN: ""
    - name: Execute Component Task
      run: eval "$ENACT_MATRIX_COMMAND"
      env:
        CI_COMPONENT: ${{ matrix.component }}
        ENACT_MATRIX_COMMAND: ${{ matrix.command }}
        ENACT_MAX_PARALLEL: ${{ matrix.max_parallel }}
        ENACT_PREEMPTION_NOTICE_SEC: ${{ matrix.preemption_notice_sec }}
        ENACT_RECORD: ${{ (github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch) && 'every' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) && 'auto' || 'off' }}
        ENACT_RUNNER_TIER: ${{ matrix.runner_tier }}
        ENACT_TOPOLOGY: ${{ matrix.topology }}
    - name: Upload Execution Telemetry & Workflow Dashboard
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: telemetry-${{ matrix.task_id }}
        path: |-
          .enact/state/telemetry.json
          .enact/state/summary.html
          .enact/state/runs/*/services/*.log
        retention-days: "1"
    - name: Upload Recorded Footprints
      if: ${{ always() && (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch) }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-footprints-${{ matrix.task_id }}
        path: .enact/state/cache/trace-reach.d/
        retention-days: "1"
    - name: Save Python build & venv cache
      if: ((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') != '' && contains(matrix.technology, 'python') && vars.ENACT_UV_CACHE_DIR == '' && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && steps.python_l1_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.python_l1_cache.outputs.cache-primary-key }}
        path: |-
          ${{ env.UV_CACHE_DIR }}
          /tmp/.cache/pip
    - parallel:
      - name: Save Go build cache
        if: (((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && hashFiles('**/go.mod', '**/go.sum') != '' && contains(matrix.technology, 'go') && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.go_l1_cache.outputs.cache-matched-key, format('{0}-go-{1}-', runner.os, hashFiles('**/go.mod', '**/go.sum'))))) && steps.go_l1_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.go_l1_cache.outputs.cache-primary-key }}
          path: |-
            /tmp/go-build
            /tmp/go/pkg/mod
      - name: Save enve Store (L1 GHA Cache)
        if: (steps.enve_store_ready.outputs.ready != 'true' && ((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1'))) && steps.nix_l1_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.nix_l1_cache.outputs.cache-primary-key }}
          path: ~/.local/share/enve/store
      - name: Save Browsers [chromium]
        if: ((github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && matrix.browsers && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && steps.browsers_l1_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.browsers_l1_cache.outputs.cache-primary-key }}
          path: /tmp/.cache/ms-playwright
      - name: Save Cache [node_build]
        if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.cache_node_build.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_node_build.outputs.cache-primary-key }}
          path: .turbo
      - name: Save Cache [vitest_transforms]
        if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.cache_vitest_transforms.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_vitest_transforms.outputs.cache-primary-key }}
          path: node_modules/.vitest-cache
