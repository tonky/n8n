    - name: Install committed enact & enve builds
      run: |
        P="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        E="${GITHUB_WORKSPACE:-$PWD}/bin/$P/enact"
        [ -f "$E" ] || E="${GITHUB_WORKSPACE:-$PWD}/bin/enact"
        [ -f "$E" ] || E="$(command -v enact || echo "$HOME/.cargo/bin/enact")"
        chmod +x "$E" 2>/dev/null || true
        "$E" --version >/dev/null 2>&1 || { echo "::error title=No enact for $P::$E does not run on this $P runner; commit its build as bin/$P/enact"; exit 1; }
        "$E" ci install-binaries
    - name: Ensure enve & enact CLI on PATH
      id: setup-runner
      run: enact ci setup-runner
    - parallel:
      - name: Restore Node dependency cache
        id: node_l1_cache
        if: ${{ steps.runner_caches.outputs.host == '' }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-node-v3-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'enve.lock', 'pnpm-workspace.yaml') }}
          path: |-
            .enact/state/pnpm-store
            node_modules/.cache
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node-v3-
    - name: Record Restored Package Caches
      if: steps.runner_caches.outputs.host == '' && steps.node_l1_cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
      continue-on-error: true
      run: enact ci cache-delta record
      env:
        ENACT_CACHE_DELTA: |-
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache node_modules/.cache
        ENACT_CACHE_HITS: node_l1_cache=${{ steps.node_l1_cache.outputs.cache-hit }}
    - name: Pull Dependencies via enve
      if: ${{ steps.node_l1_cache.outputs.cache-hit != 'true' }}
      run: enact ci deps pull --remote signed
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_ENVIRONMENT_DIRS: "[\"packages/@n8n/agents\",\"packages/@n8n/ai-utilities\",\"packages/@n8n/ai-workflow-builder.ee\",\"packages/@n8n/api-types\",\"packages/@n8n/app-sdk\",\"packages/@n8n/backend-common\",\"packages/@n8n/backend-network\",\"packages/@n8n/backend-services\",\"packages/@n8n/blob-storage\",\"packages/@n8n/chat-hub\",\"packages/@n8n/cli\",\"packages/@n8n/client-oauth2\",\"packages/@n8n/code-runtime-js\",\"packages/@n8n/code-task-contract\",\"packages/@n8n/codemirror-lang\",\"packages/@n8n/codemirror-lang-sql\",\"packages/@n8n/config\",\"packages/@n8n/crdt\",\"packages/@n8n/db\",\"packages/@n8n/decorators\",\"packages/@n8n/di\",\"packages/@n8n/engine\",\"packages/@n8n/errors\",\"packages/@n8n/eslint-config\",\"packages/@n8n/eslint-plugin-community-nodes\",\"packages/@n8n/expression-runtime\",\"packages/@n8n/imap\",\"packages/@n8n/inbound-auth\",\"packages/@n8n/instance-ai\",\"packages/@n8n/json-schema-to-zod\",\"packages/@n8n/leases\",\"packages/@n8n/mcp-apps\",\"packages/@n8n/mcp-browser\",\"packages/@n8n/mcp-browser-extension\",\"packages/@n8n/module-cli\",\"packages/@n8n/n8n-node-codegen\",\"packages/@n8n/node-cli\",\"packages/@n8n/node-engine-compatibility\",\"packages/@n8n/nodes-langchain\",\"packages/@n8n/permissions\",\"packages/@n8n/scan-community-package\",\"packages/@n8n/scheduler\",\"packages/@n8n/stylelint-config\",\"packages/@n8n/syslog-client\",\"packages/@n8n/task-runner\",\"packages/@n8n/task-runner-python\",\"packages/@n8n/telemetry\",\"packages/@n8n/tournament\",\"packages/@n8n/utils\",\"packages/@n8n/vitest-config\",\"packages/@n8n/workflow-engine-check\",\"packages/@n8n/workflow-sdk\",\"packages/cli\",\"packages/core\",\"packages/frontend/@n8n/chat\",\"packages/frontend/@n8n/composables\",\"packages/frontend/@n8n/design-system\",\"packages/frontend/@n8n/eslint-plugin-design-system\",\"packages/frontend/@n8n/frontend-constants\",\"packages/frontend/@n8n/frontend-module-sdk\",\"packages/frontend/@n8n/frontend-test-utils\",\"packages/frontend/@n8n/frontend-utils\",\"packages/frontend/@n8n/i18n\",\"packages/frontend/@n8n/rest-api-client\",\"packages/frontend/@n8n/stores\",\"packages/frontend/editor-ui\",\"packages/modules/apps/backend\",\"packages/modules/apps/frontend\",\"packages/modules/code-sandbox/backend\",\"packages/modules/data-table/backend\",\"packages/modules/execution-ledger/backend\",\"packages/modules/execution-limits/backend\",\"packages/modules/inbox/frontend\",\"packages/modules/insights/backend\",\"packages/modules/insights/frontend\",\"packages/modules/instance-registry/frontend\",\"packages/modules/mcp/frontend\",\"packages/modules/otel/frontend\",\"packages/modules/promotions/frontend\",\"packages/modules/quick-connect/backend\",\"packages/modules/self-healing/frontend\",\"packages/modules/type-availability-policies/frontend\",\"packages/modules/workflow-builder/backend\",\"packages/node-dev\",\"packages/nodes-base\",\"packages/quality/environments/containers\",\"packages/quality/policy/code-health\",\"packages/quality/policy/rules-engine\",\"packages/quality/testing/janitor\",\"packages/quality/testing/test-impact\",\"packages/workflow\"]"
        ENACT_ENVIRONMENT_FILES: "[\".enact/environments/browser/enve.cue\",\".enact/environments/checks/enve.cue\"]"
        ENACT_JOB_SERVICES: kafka,mysql,postgres,proxy,redis
        ENACT_PREPARE_ENVIRONMENT_FILES: "[\".enact/environments/checks/enve.cue\"]"
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: "16"
    - name: Check enve Stores into the Host Cache
      if: ${{ steps.runner_caches.outputs.host != '' && steps.node_l1_cache.outputs.cache-hit != 'true' }}
      run: enact ci check-store
    - name: Install Project Dependencies
      if: ${{ steps.node_l1_cache.outputs.cache-hit != 'true' }}
      run: enact ci deps install node --manager pnpm
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        ENACT_ENVIRONMENT_FILE: .enact/environments/checks/enve.cue
        GITHUB_TOKEN: ""
        npm_config_build_from_source: "false"
    - name: Check Package Caches for New Entries
      id: cache_delta
      if: ${{ !cancelled() && steps.runner_caches.outputs.host == '' && steps.node_l1_cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request' }}
      continue-on-error: true
      run: enact ci cache-delta check
      env:
        ENACT_CACHE_DELTA: |-
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache node_modules/.cache
        ENACT_CACHE_HITS: node_l1_cache=${{ steps.node_l1_cache.outputs.cache-hit }}
    - parallel:
      - name: Save Node dependency cache
        if: (github.event_name != 'pull_request' && steps.cache_delta.outputs.node_l1_cache == 'true' && steps.runner_caches.outputs.host == '') && github.event_name != 'pull_request' && steps.node_l1_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.node_l1_cache.outputs.cache-primary-key }}
          path: |-
            .enact/state/pnpm-store
            node_modules/.cache
