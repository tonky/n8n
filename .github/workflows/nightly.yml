            if [ -z "$(find "$mirror/HEAD" -mmin -1 2>/dev/null || true)" ] || [ "$ref_current" != "$GITHUB_SHA" ] || ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags --prune "$url" "${refs[@]}"
                if ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags "$url" "$GITHUB_SHA"
                fi
            fi
            touch "$mirror" "$mirror/HEAD" 2>/dev/null || true
        ) 9>"$mirror.lock"
        cd "$GITHUB_WORKSPACE"
        trap 'rm -rf "$GITHUB_WORKSPACE/.git"' ERR
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        echo "$mirror/objects" > .git/objects/info/alternates
        [ ! -f "$mirror/shallow" ] || cp "$mirror/shallow" .git/shallow
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local gc.auto 0
        git fetch -q --no-tags "$mirror" "+refs/heads/*:refs/remotes/origin/*"
        if [ -n "${ENACT_SPARSE_CONE:-}" ]; then
            mapfile -t cone < <(printf '%s\n' "$ENACT_SPARSE_CONE" | sed '/^[[:space:]]*$/d')
            git sparse-checkout set --cone "${cone[@]}"
        fi
        case "$GITHUB_REF" in
            refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$GITHUB_SHA" ;;
            *) git checkout -q --force --detach "$GITHUB_SHA" ;;
        esac
        git log -1 --format='Checked out %H through the host mirror'
      env:
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: |-
          .enact
          cue.mod
          .github
          bin
    - name: Checkout Repository (sparse)
      if: ${{ steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure' }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        sparse-checkout: |-
          .enact
          cue.mod
          .github
          bin
        sparse-checkout-cone-mode: "true"
        submodules: "false"
    - name: Install committed enact & enve builds
      run: |
        P="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        E="${GITHUB_WORKSPACE:-$PWD}/bin/$P/enact"
        [ -f "$E" ] || E="${GITHUB_WORKSPACE:-$PWD}/bin/enact"
        [ -f "$E" ] || E="$(command -v enact || echo "$HOME/.cargo/bin/enact")"
        chmod +x "$E" 2>/dev/null || true
        "$E" --version >/dev/null 2>&1 || { echo "::error title=No enact for $P::$E does not run on this $P runner; commit its build as bin/$P/enact"; exit 1; }
        "$E" ci install-binaries
    - name: Ensure enve & enact CLI on PATH
      run: enact ci setup-runner
    - name: Download All Component Telemetry
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        path: .enact/state/telemetry
        pattern: telemetry-*
    - name: Download the Audited Runs' Selection Records
      continue-on-error: true
      run: |
        set -uo pipefail
        if ! command -v gh >/dev/null 2>&1; then
          echo "::warning::no gh on this runner: the escape audit has no selection records"
          exit 0
        fi
        runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$ENACT_AUDIT_WORKFLOW" --event push \
          --branch "$GITHUB_REF_NAME" --status completed --limit "$ENACT_AUDIT_RUNS" \
          --json databaseId --jq '.[].databaseId') || {
          echo "::warning::could not list $ENACT_AUDIT_WORKFLOW runs: the escape audit has no selection records"
          exit 0
        }
        for id in $runs; do
          if gh run download "$id" -R "$GITHUB_REPOSITORY" --name enact-selection \
            --dir ".enact/state/telemetry/selection-$id" >/dev/null 2>&1; then
            echo "Selection record of run $id"
          else
            echo "::notice::run $id of $ENACT_AUDIT_WORKFLOW kept no selection record"
          fi
        done
      env:
        ENACT_AUDIT_RUNS: "5"
        ENACT_AUDIT_WORKFLOW: n8n-platform
        GH_TOKEN: ${{ github.token }}
    - name: Generate Consolidated Telemetry Summary
      continue-on-error: true
      run: enact runs report --dir .enact/state/telemetry
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENACT_UPLOAD_REPORT: ${{ env.ENACT_REMOTE_SAVE_EVENT == 'true' }}
    - name: Upload Master Workflow Dashboard
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-workflow-summary
        path: .enact/state/summary.html
        retention-days: "1"
  test:
    name: Run Tests
    needs:
    - detect
    if: ${{ needs.detect.outputs.matrix != '{"include":[]}' && needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != '' }}
    uses: ./.github/workflows/nightly-matrix.yml
    with:
      matrix: ${{ needs.detect.outputs.matrix }}
      warm_reach: ${{ inputs.warm_reach }}
    secrets: inherit
  test-built:
    name: Run Tests on Built Outputs
    needs:
    - detect
    - build-outputs
    - build-outputs-2
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.built != '{"include":[]}' && needs.detect.outputs.built != '[]' && needs.detect.outputs.built != '' }}
    uses: ./.github/workflows/nightly-matrix.yml
    with:
      matrix: ${{ needs.detect.outputs.built }}
      warm_reach: ${{ inputs.warm_reach }}
    secrets: inherit
