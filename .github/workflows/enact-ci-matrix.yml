# Generated by enact from .enact; edit the pipeline and run `enact ci generate`.
name: n8n-platform matrix
on:
  workflow_call:
    inputs:
      history_input_artifact:
        type: string
        required: false
      matrix:
        type: string
        required: true
      warm_reach:
        type: string
        required: false
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  ENACT_OUTPUTS_PRODUCERS: "{\"-n8n-db--build\":{\"job\":\"@n8n/db:build\",\"paths\":\"packages/@n8n/db/dist\\npackages/@n8n/db/dist/index.js\\npackages/@n8n/db/src/migrations/sqlite/index.ts\\npackages/@n8n/db/src/migrations/postgresdb/index.ts\\n.enact/state/outputs/-n8n-db--build.key\"},\"playwright--build\":{\"job\":\"playwright:build\",\"paths\":\"packages/@n8n/agents/dist\\npackages/@n8n/ai-node-sdk/dist\\npackages/@n8n/ai-utilities/dist\\npackages/@n8n/ai-workflow-builder.ee/dist\\npackages/@n8n/api-types/dist\\npackages/@n8n/backend-common/dist\\npackages/@n8n/backend-network/dist\\npackages/@n8n/backend-services/dist\\npackages/@n8n/backend-test-utils/dist\\npackages/@n8n/blob-storage/dist\\npackages/@n8n/chat-hub/dist\\npackages/@n8n/client-oauth2/dist\\npackages/@n8n/codemirror-lang/dist\\npackages/@n8n/codemirror-lang-html/dist\\npackages/@n8n/codemirror-lang-sql/dist\\npackages/@n8n/config/dist\\npackages/@n8n/constants/dist\\npackages/@n8n/decorators/dist\\npackages/@n8n/di/dist\\npackages/@n8n/engine/dist\\npackages/@n8n/errors/dist\\npackages/@n8n/eslint-config/dist\\npackages/@n8n/eslint-plugin-community-nodes/dist\\npackages/@n8n/expression-runtime/dist\\npackages/@n8n/imap/dist\\npackages/@n8n/inbound-auth/dist\\npackages/@n8n/instance-ai/dist\\npackages/@n8n/json-schema-to-zod/dist\\npackages/@n8n/mcp-apps/dist\\npackages/@n8n/mcp-browser/dist\\npackages/@n8n/node-engine-compatibility/dist\\npackages/@n8n/nodes-langchain/dist\\npackages/@n8n/oxlint-config/dist\\npackages/@n8n/permissions/dist\\npackages/@n8n/scheduler/dist\\npackages/@n8n/stylelint-config/dist\\npackages/@n8n/syslog-client/dist\\npackages/@n8n/task-runner/dist\\npackages/@n8n/telemetry/dist\\npackages/@n8n/tournament/dist\\npackages/@n8n/typeorm/dist\\npackages/@n8n/utils/dist\\npackages/@n8n/vitest-config/dist\\npackages/@n8n/workflow-sdk/dist\\npackages/cli/dist\\npackages/core/dist\\npackages/frontend/@n8n/chat/dist\\npackages/frontend/@n8n/composables/dist\\npackages/frontend/@n8n/design-system/dist\\npackages/frontend/@n8n/eslint-plugin-design-system/dist\\npackages/frontend/@n8n/frontend-constants/dist\\npackages/frontend/@n8n/frontend-utils/dist\\npackages/frontend/@n8n/i18n/dist\\npackages/frontend/@n8n/rest-api-client/dist\\npackages/frontend/@n8n/stores/dist\\npackages/frontend/editor-ui/dist\\npackages/modules/apps/backend/dist\\npackages/modules/insights/backend/dist\\npackages/modules/quick-connect/backend/dist\\npackages/modules/workflow-builder/backend/dist\\npackages/nodes-base/dist\\npackages/quality/policy/rules-engine/dist\\npackages/quality/testing/janitor/dist\\npackages/quality/testing/test-impact/dist\\npackages/workflow/dist\\npackages/cli/dist/commands/start.js\\npackages/frontend/editor-ui/dist/index.html\\n.enact/state/outputs/playwright--build.key\"}}"
  ENACT_REMOTE_SAVE_EVENT: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
  ENACT_SAVE_EVENT: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
  ENVE_CACHE_PUBLIC_KEY: enve-r2-1:ckHPTeWVef6mba+1AwWHjKYCsUWKPfP9IXPm5YXNoHg=
  ENVE_SERVICE_GID: "1000"
  ENVE_SERVICE_UID: "1000"
  ENVE_SUBSTITUTERS: https://pub-30fd937eb7634039b8c49d49bfec91a9.r2.dev,https://cache.nixos.org
  ENVE_TRUSTED_PUBLIC_KEYS: enve-r2-1:ckHPTeWVef6mba+1AwWHjKYCsUWKPfP9IXPm5YXNoHg=
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: --max-old-space-size=6144
  UV_CACHE_DIR: /tmp/.cache/uv
  XDG_CACHE_HOME: /tmp/.cache
jobs:
  entry:
    name: ${{ matrix.component }}${{ matrix.env.ENACT_SCHEDULING_HINT }}
    env:
      ENACT_OBSERVATIONS_ENABLED: "1"
    if: ${{ inputs.matrix != '{"include":[]}' && inputs.matrix != '[]' && inputs.matrix != '' }}
    strategy:
      fail-fast: false
      max-parallel: 64
      matrix: ${{ fromJson(inputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    steps:
    - name: Probe Runner Caches
      id: runner_caches
      run: |
        set -euo pipefail
        host="${ENACT_HOST_CACHE:-}"
        if [ -n "$host" ] && ! { [ -d "$host/repo" ] && [ -w "$host/repo" ]; }; then
            echo "::warning::ENACT_HOST_CACHE=$host has no writable repo/ directory; using GitHub's cache"
            host=""
        fi
        if [ -n "$host" ]; then
            mkdir -p "$host/repo/git" "$host/repo/outputs"
            echo "ENACT_GIT_MIRROR=$host/repo/git/${GITHUB_REPOSITORY##*/}.git" >> "$GITHUB_ENV"
            echo "ENACT_OUTPUTS_CACHE=$host/repo/outputs" >> "$GITHUB_ENV"
        fi
        echo "ENACT_HOST_CACHE=$host" >> "$GITHUB_ENV"
        printf 'host=%s\n' "$host" >> "$GITHUB_OUTPUT"
        printf 'Host cache: %s\n' "${host:-none}"
    - name: Look Up Built Outputs in the Host Cache
      id: outputs-host-lookup
      if: ${{ steps.runner_caches.outputs.host != '' && matrix.output_key != '' }}
      continue-on-error: true
      run: |
        set -euo pipefail
        store="${ENACT_OUTPUTS_CACHE:-}"
        entry="$store/${GITHUB_REPOSITORY:-repo}/$ENACT_OUTPUTS_KEY"
        hit=false
        if [ -n "$store" ] && [ -f "$entry/.enact-ready" ]; then
            hit=true
            while IFS= read -r pattern; do
                [ -n "$pattern" ] || continue
                # shellcheck disable=SC2086 # glob pattern from outputs.paths
                for src in "$entry"/$pattern; do
                    [ -e "$src" ] || [ -L "$src" ] || { hit=false; break 2; }
                done
            done <<<"$ENACT_OUTPUTS_PATHS"
        fi
        if [ "$hit" = true ]; then
            touch "$entry/.enact-ready" 2>/dev/null || true
        fi
        printf 'cache-hit=%s\n' "$hit" >> "$GITHUB_OUTPUT"
      env:
        ENACT_OUTPUTS_KEY: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        ENACT_OUTPUTS_PATHS: ${{ matrix.output_paths }}
    - name: Look Up Built Outputs
      id: outputs-lookup
      if: ${{ matrix.output_key != '' }}
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        lookup-only: "true"
        path: ${{ matrix.output_paths }}
    - name: Skip on Built Outputs Found
      id: skip
      if: ${{ matrix.output_key != '' }}
      run: "[ \"$HIT\" != true ] || echo hit=true >> \"$GITHUB_OUTPUT\""
      env:
        HIT: ${{ steps.outputs-host-lookup.outputs.cache-hit == 'true' || steps.outputs-lookup.outputs.cache-hit == 'true' }}
    - name: Checkout Repository (sparse) from the Host Mirror
      id: host_checkout
      if: ${{ (steps.runner_caches.outputs.host != '') && !steps.skip.outputs.hit }}
      continue-on-error: true
      run: |
        set -euo pipefail
        git config --global --add safe.directory "*"
        url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        mirror="$ENACT_GIT_MIRROR"
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENACT_GIT_TOKEN" | base64 | tr -d '\n')"
        refs=("+refs/heads/*:refs/heads/*")
        case "$GITHUB_REF" in
            refs/pull/*) refs+=("+$GITHUB_REF:$GITHUB_REF") ;;
        esac
        (
            flock 9
            if [ ! -f "$mirror/HEAD" ]; then
                git init -q --bare "$mirror"
                git -C "$mirror" config uploadpack.allowAnySHA1InWant true
                git -C "$mirror" config gc.auto 0
            fi
            ref_current=""
            case "$GITHUB_REF" in
                refs/heads/*|refs/pull/*) ref_current=$(git -C "$mirror" rev-parse --verify -q "$GITHUB_REF^{commit}" 2>/dev/null || true) ;;
                *) ref_current="$GITHUB_SHA" ;;
            esac
            if [ -z "$(find "$mirror/HEAD" -mmin -1 2>/dev/null || true)" ] || [ "$ref_current" != "$GITHUB_SHA" ] || ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags --prune "$url" "${refs[@]}"
                if ! git -C "$mirror" cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
                    git -C "$mirror" -c "http.extraheader=$header" fetch -q --no-tags "$url" "$GITHUB_SHA"
                fi
            fi
            touch "$mirror" "$mirror/HEAD" 2>/dev/null || true
        ) 9>"$mirror.lock"
        cd "$GITHUB_WORKSPACE"
        trap 'rm -rf "$GITHUB_WORKSPACE/.git"' ERR
        find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        git init -q .
        echo "$mirror/objects" > .git/objects/info/alternates
        [ ! -f "$mirror/shallow" ] || cp "$mirror/shallow" .git/shallow
        git remote add origin "$url"
        git config --local "http.$GITHUB_SERVER_URL/.extraheader" "$header"
        git config --local gc.auto 0
        git fetch -q --no-tags "$mirror" "+refs/heads/*:refs/remotes/origin/*"
        if [ -n "${ENACT_SPARSE_CONE:-}" ]; then
            mapfile -t cone < <(printf '%s\n' "$ENACT_SPARSE_CONE" | sed '/^[[:space:]]*$/d')
            git sparse-checkout set --cone "${cone[@]}"
        fi
        case "$GITHUB_REF" in
            refs/heads/*) git checkout -q --force -B "${GITHUB_REF#refs/heads/}" "$GITHUB_SHA" ;;
            *) git checkout -q --force --detach "$GITHUB_SHA" ;;
        esac
        git log -1 --format='Checked out %H through the host mirror'
      env:
        ENACT_GIT_TOKEN: ${{ github.token }}
        ENACT_SPARSE_CONE: ${{ matrix.sparse_checkout }}
    - name: Checkout Repository (sparse)
      if: ${{ (matrix.sparse_checkout != '' && (steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure')) && !steps.skip.outputs.hit }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        sparse-checkout: ${{ matrix.sparse_checkout }}
        sparse-checkout-cone-mode: "true"
        submodules: "false"
    - name: Checkout Repository (full)
      if: ${{ (matrix.sparse_checkout == '' && (steps.runner_caches.outputs.host == '' || steps.host_checkout.outcome == 'failure')) && !steps.skip.outputs.hit }}
      uses: actions/checkout@v7
      with:
        fetch-depth: "1"
        fetch-tags: "false"
        lfs: "false"
        show-progress: "false"
        submodules: "false"
    - name: Install committed enact & enve builds
      if: ${{ !steps.skip.outputs.hit }}
      run: |
        P="$(uname -s | tr '[:upper:]' '[:lower:]' | sed 's/^darwin$/macos/')-$(uname -m | sed 's/^arm64$/aarch64/')"
        E="${GITHUB_WORKSPACE:-$PWD}/bin/$P/enact"
        [ -f "$E" ] || E="${GITHUB_WORKSPACE:-$PWD}/bin/enact"
        [ -f "$E" ] || E="$(command -v enact || echo "$HOME/.cargo/bin/enact")"
        chmod +x "$E" 2>/dev/null || true
        "$E" --version >/dev/null 2>&1 || { echo "::error title=No enact for $P::$E does not run on this $P runner; commit its build as bin/$P/enact"; exit 1; }
        "$E" ci install-binaries
    - name: Ensure enve & enact CLI on PATH
      if: ${{ !steps.skip.outputs.hit }}
      run: enact ci setup-runner
    - name: Download the Selected CI History
      if: ${{ !steps.skip.outputs.hit }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.history_input_artifact }}
        path: ${{ runner.temp }}/enact-history-input
    - name: Import the Selected CI History
      if: ${{ !steps.skip.outputs.hit }}
      run: |-
        export ENACT_HISTORY_DIR="$RUNNER_TEMP/enact-history"
        printf 'ENACT_HISTORY_DIR=%s\n' "$ENACT_HISTORY_DIR" >> "$GITHUB_ENV"
        enact ci history import --input "$RUNNER_TEMP/enact-history-input/snapshot.json" --manifest "$RUNNER_TEMP/enact-history-input/snapshot.manifest.json" --output "$ENACT_HISTORY_DIR"
    - name: Restore Built Outputs from the Host Cache
      id: outputs-host
      if: ${{ (steps.runner_caches.outputs.host != '' && toJson(matrix.output_keys) != 'null') && !steps.skip.outputs.hit }}
      continue-on-error: true
      run: enact ci host-outputs restore
      env:
        ENACT_OUTPUTS_NEEDED: ${{ toJson(matrix.output_keys) }}
        ENACT_OUTPUTS_PLATFORM: ${{ runner.os }}-${{ runner.arch }}
    - name: Restore Built Outputs (@n8n/db:build)
      id: outputs--n8n-db--build
      if: ${{ (matrix.output_keys['-n8n-db--build'] != '' && steps.outputs-host.outputs['-n8n-db--build'] != 'true') && !steps.skip.outputs.hit }}
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: enact-outputs--n8n-db--build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_keys['-n8n-db--build'] }}
        path: |-
          packages/@n8n/db/dist
          packages/@n8n/db/dist/index.js
          packages/@n8n/db/src/migrations/sqlite/index.ts
          packages/@n8n/db/src/migrations/postgresdb/index.ts
          .enact/state/outputs/-n8n-db--build.key
    - name: Restore Built Outputs (playwright:build)
      id: outputs-playwright--build
      if: ${{ (matrix.output_keys['playwright--build'] != '' && steps.outputs-host.outputs['playwright--build'] != 'true') && !steps.skip.outputs.hit }}
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: enact-outputs-playwright--build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_keys['playwright--build'] }}
        path: |-
          packages/@n8n/agents/dist
          packages/@n8n/ai-node-sdk/dist
          packages/@n8n/ai-utilities/dist
          packages/@n8n/ai-workflow-builder.ee/dist
          packages/@n8n/api-types/dist
          packages/@n8n/backend-common/dist
          packages/@n8n/backend-network/dist
          packages/@n8n/backend-services/dist
          packages/@n8n/backend-test-utils/dist
          packages/@n8n/blob-storage/dist
          packages/@n8n/chat-hub/dist
          packages/@n8n/client-oauth2/dist
          packages/@n8n/codemirror-lang/dist
          packages/@n8n/codemirror-lang-html/dist
          packages/@n8n/codemirror-lang-sql/dist
          packages/@n8n/config/dist
          packages/@n8n/constants/dist
          packages/@n8n/decorators/dist
          packages/@n8n/di/dist
          packages/@n8n/engine/dist
          packages/@n8n/errors/dist
          packages/@n8n/eslint-config/dist
          packages/@n8n/eslint-plugin-community-nodes/dist
          packages/@n8n/expression-runtime/dist
          packages/@n8n/imap/dist
          packages/@n8n/inbound-auth/dist
          packages/@n8n/instance-ai/dist
          packages/@n8n/json-schema-to-zod/dist
          packages/@n8n/mcp-apps/dist
          packages/@n8n/mcp-browser/dist
          packages/@n8n/node-engine-compatibility/dist
          packages/@n8n/nodes-langchain/dist
          packages/@n8n/oxlint-config/dist
          packages/@n8n/permissions/dist
          packages/@n8n/scheduler/dist
          packages/@n8n/stylelint-config/dist
          packages/@n8n/syslog-client/dist
          packages/@n8n/task-runner/dist
          packages/@n8n/telemetry/dist
          packages/@n8n/tournament/dist
          packages/@n8n/typeorm/dist
          packages/@n8n/utils/dist
          packages/@n8n/vitest-config/dist
          packages/@n8n/workflow-sdk/dist
          packages/cli/dist
          packages/core/dist
          packages/frontend/@n8n/chat/dist
          packages/frontend/@n8n/composables/dist
          packages/frontend/@n8n/design-system/dist
          packages/frontend/@n8n/eslint-plugin-design-system/dist
          packages/frontend/@n8n/frontend-constants/dist
          packages/frontend/@n8n/frontend-utils/dist
          packages/frontend/@n8n/i18n/dist
          packages/frontend/@n8n/rest-api-client/dist
          packages/frontend/@n8n/stores/dist
          packages/frontend/editor-ui/dist
          packages/modules/apps/backend/dist
          packages/modules/insights/backend/dist
          packages/modules/quick-connect/backend/dist
          packages/modules/workflow-builder/backend/dist
          packages/nodes-base/dist
          packages/quality/policy/rules-engine/dist
          packages/quality/testing/janitor/dist
          packages/quality/testing/test-impact/dist
          packages/workflow/dist
          packages/cli/dist/commands/start.js
          packages/frontend/editor-ui/dist/index.html
          .enact/state/outputs/playwright--build.key
    - name: Require Built Outputs
      if: ${{ (toJson(matrix.output_keys) != 'null') && !steps.skip.outputs.hit }}
      run: enact ci host-outputs require
      env:
        ENACT_OUTPUTS_NEEDED: ${{ toJson(matrix.output_keys) }}
        ENACT_OUTPUTS_PLATFORM: ${{ runner.os }}-${{ runner.arch }}
        ENACT_OUTPUTS_STEPS: ${{ toJson(steps) }}
    - parallel:
      - name: Restore Python build & venv cache
        id: python_l1_cache
        if: ${{ (contains(matrix.technology, 'python') && steps.runner_caches.outputs.host == '' && hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') != '') && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-python-${{ hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') }}
          path: |-
            /tmp/.cache/uv
            /tmp/.cache/pip
          restore-keys: ${{ runner.os }}-python-
      - name: Restore Node dependency cache
        id: node_l1_cache
        if: ${{ ((contains(matrix.technology, 'typescript') || contains(matrix.technology, 'javascript') || contains(matrix.technology, 'node')) && steps.runner_caches.outputs.host == '') && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-node-v2-${{ matrix.task_id }}-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'enve.lock', 'pnpm-workspace.yaml') }}
          path: |-
            .enact/state/pnpm-store
            node_modules/.cache
          restore-keys: |-
            ${{ runner.os }}-${{ runner.arch }}-node-v2-${{ matrix.task_id }}-
            ${{ runner.os }}-${{ runner.arch }}-node-v2-
      - name: Restore Cache [node_build]
        id: cache_node_build
        if: ${{ (contains(format(',{0},', matrix.caches), ',node_build,')) && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: node_build-${{ runner.os }}-${{ matrix.task_id }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
          path: .turbo
          restore-keys: |-
            node_build-${{ runner.os }}-${{ matrix.task_id }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}-
            node_build-${{ runner.os }}-${{ matrix.task_id }}-
            node_build-${{ runner.os }}-
      - name: Restore Cache [vitest_transforms]
        id: cache_vitest_transforms
        if: ${{ (contains(format(',{0},', matrix.caches), ',vitest_transforms,')) && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: vitest_transforms-${{ runner.os }}-${{ matrix.task_id }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: node_modules/.vitest-cache
          restore-keys: |-
            vitest_transforms-${{ runner.os }}-${{ matrix.task_id }}-
            vitest_transforms-${{ runner.os }}-
    - name: Record Restored Package Caches
      if: ${{ (steps.runner_caches.outputs.host == '') && !steps.skip.outputs.hit }}
      continue-on-error: true
      run: enact ci cache-delta record
      env:
        ENACT_CACHE_DELTA: |-
          python_l1_cache /tmp/.cache/uv
          python_l1_cache /tmp/.cache/pip
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache node_modules/.cache
    - name: Restore Browsers [chromium]
      id: browsers_l1_cache
      if: ${{ (matrix.browsers) && !steps.skip.outputs.hit }}
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: ${{ runner.os }}-browsers-chromium-${{ hashFiles('packages/quality/testing/playwright/package.json', 'pnpm-lock.yaml') }}
        path: /tmp/.cache/ms-playwright
    - name: Provision Browsers [chromium]
      if: ${{ (matrix.browsers) && !steps.skip.outputs.hit }}
      continue-on-error: true
      run: |-
        enact ci browser-cache provision
        enact ci browser-cache hydrate
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_BROWSERS_ARTIFACT: tools/playwright-browsers-linux-amd64.tar.zst
        ENACT_BROWSERS_ENV: PLAYWRIGHT_BROWSERS_PATH
        ENACT_BROWSERS_PATH: /tmp/.cache/ms-playwright
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
    - name: Download the Reach Map
      if: ${{ !steps.skip.outputs.hit }}
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: enact-reach-map
        path: ${{ runner.temp }}/enact-reach
    - name: Plan with the Detected Reach Map
      if: ${{ !steps.skip.outputs.hit }}
      run: |-
        if [ -n "${GITHUB_HEAD_SHA:-}" ] && [ -z "$(git rev-list -n1 --no-walk --ignore-missing --missing=allow-any "$GITHUB_HEAD_SHA" -- 2>/dev/null)" ]; then
          git fetch --no-tags --depth=1 --filter=blob:none origin "$GITHUB_HEAD_SHA" 2>/dev/null || true
        fi
        if [ -f "$RUNNER_TEMP/enact-reach/map.bin" ]; then
          echo "ENACT_REACH_FILE=$RUNNER_TEMP/enact-reach/map.bin" >> "$GITHUB_ENV"
        fi
      env:
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    - name: Fetch the Revisions Selection Ages By
      if: ${{ (matrix.selects_in_job) && !steps.skip.outputs.hit }}
      continue-on-error: true
      run: |-
        FETCH="git fetch --no-tags --depth=1 --filter=blob:none origin"
        # shellcheck disable=SC2046,SC2086 # one word per revision
        set -- $(enact reach revisions --missing 2>/dev/null || true) $ENACT_SELECT_BASE
        if [ "$#" -gt 0 ]; then
          $FETCH "$@" 2>/dev/null || for rev in "$@"; do
            $FETCH "$rev" 2>/dev/null || true
          done
        fi
      env:
        ENACT_SELECT_BASE: ${{ matrix.select_base }}
    - name: Pull Dependencies via enve
      if: ${{ !steps.skip.outputs.hit }}
      run: enact ci deps pull --component --remote signed
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_COMPONENT_DIR: ${{ matrix.component_dir }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: "16"
    - name: Check enve Stores into the Host Cache
      if: ${{ (steps.runner_caches.outputs.host != '') && !steps.skip.outputs.hit }}
      run: enact ci check-store
    - name: Install Project Dependencies
      if: ${{ (hashFiles('package.json') != '' && (contains(matrix.technology, 'typescript') || contains(matrix.technology, 'javascript') || contains(matrix.technology, 'node'))) && !steps.skip.outputs.hit }}
      run: enact ci deps install node --manager pnpm --filters
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        ENACT_MATRIX_FILTER_ARGS: ${{ matrix.filter_args }}
        GITHUB_TOKEN: ""
        npm_config_build_from_source: "false"
    - name: Execute Component Task
      if: ${{ !steps.skip.outputs.hit }}
      run: eval "$ENACT_MATRIX_COMMAND"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        CI_COMPONENT: ${{ matrix.component }}
        ENACT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        ENACT_MATRIX_COMMAND: ${{ matrix.command }}
        ENACT_MAX_PARALLEL: ${{ matrix.max_parallel }}
        ENACT_PREEMPTION_NOTICE_SEC: ${{ matrix.preemption_notice_sec }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENACT_RECORD: ${{ (github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch) && 'every' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch) && 'auto' || 'off' }}
        ENACT_RUNNER_ALLOCATION: ${{ matrix.env.ENACT_RUNNER_ALLOCATION }}
        ENACT_RUNNER_TIER: ${{ matrix.runner_tier }}
        ENACT_SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch }}
        ENACT_TOPOLOGY: ${{ matrix.topology }}
    - name: Push Updated Dependencies to the Remote Cache
      if: ${{ (success() && env.ENACT_REMOTE_SAVE_EVENT == 'true') && !steps.skip.outputs.hit }}
      continue-on-error: true
      run: enact ci deps push --signed
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_COMPONENT_DIR: ${{ matrix.component_dir }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
        ENVE_CACHE_CONCURRENCY: "16"
    - name: Upload Execution Telemetry & Workflow Dashboard
      if: ${{ (always()) && !steps.skip.outputs.hit }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: telemetry-${{ matrix.task_id }}
        path: |-
          .enact/state/telemetry.json
          .enact/state/summary.html
          .enact/state/runs/*/services/*.log
        retention-days: "1"
    - name: Upload Recorded Footprints
      if: ${{ (always() && (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref != github.event.repository.default_branch || github.event_name == 'workflow_dispatch' && inputs.warm_reach == 'true' && github.ref_name == github.event.repository.default_branch)) && !steps.skip.outputs.hit }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: ignore
        name: enact-footprints-${{ matrix.task_id }}
        path: .enact/state/cache/trace-reach.d/
        retention-days: "1"
    - name: Check Package Caches for New Entries
      id: cache_delta
      if: ${{ (!cancelled() && steps.runner_caches.outputs.host == '' && env.ENACT_SAVE_EVENT == 'true' && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && !steps.skip.outputs.hit }}
      continue-on-error: true
      run: enact ci cache-delta check
      env:
        ENACT_CACHE_DELTA: |-
          python_l1_cache /tmp/.cache/uv
          python_l1_cache /tmp/.cache/pip
          node_l1_cache .enact/state/pnpm-store
          node_l1_cache node_modules/.cache
        ENACT_UV_PRUNE: ${{ contains(matrix.technology, 'python') }}
    - name: Save Python build & venv cache
      if: ${{ ((env.ENACT_SAVE_EVENT == 'true' && contains(matrix.technology, 'python') && steps.runner_caches.outputs.host == '' && hashFiles('**/uv.lock', '**/pyproject.toml', '**/requirements.txt', '**/poetry.lock') != '' && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1') && steps.cache_delta.outputs.python_l1_cache == 'true') && steps.python_l1_cache.outputs.cache-hit != 'true') && !steps.skip.outputs.hit }}
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.python_l1_cache.outputs.cache-primary-key }}
        path: |-
          /tmp/.cache/uv
          /tmp/.cache/pip
    - parallel:
      - name: Save Browsers [chromium]
        if: ${{ ((env.ENACT_SAVE_EVENT == 'true' && matrix.browsers && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && steps.browsers_l1_cache.outputs.cache-hit != 'true') && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.browsers_l1_cache.outputs.cache-primary-key }}
          path: /tmp/.cache/ms-playwright
      - name: Save Cache [node_build]
        if: ${{ ((env.ENACT_SAVE_EVENT == 'true' && contains(format(',{0},', matrix.caches), ',node_build,') && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1') && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.cache_node_build.outputs.cache-matched-key, format('node_build-{0}-{1}-{2}-', runner.os, matrix.task_id, hashFiles('package.json', 'pnpm-lock.yaml'))))) && steps.cache_node_build.outputs.cache-hit != 'true') && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_node_build.outputs.cache-primary-key }}
          path: .turbo
      - name: Save Cache [vitest_transforms]
        if: ${{ ((env.ENACT_SAVE_EVENT == 'true' && contains(format(',{0},', matrix.caches), ',vitest_transforms,') && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && steps.cache_vitest_transforms.outputs.cache-hit != 'true') && !steps.skip.outputs.hit }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_vitest_transforms.outputs.cache-primary-key }}
          path: node_modules/.vitest-cache
    - name: Save Built Outputs to the Host Cache
      if: ${{ success() && steps.runner_caches.outputs.host != '' && !steps.skip.outputs.hit && matrix.output_key != '' }}
      continue-on-error: true
      run: enact ci host-outputs save
      env:
        ENACT_OUTPUTS_KEY: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        ENACT_OUTPUTS_PATHS: ${{ matrix.output_paths }}
    - name: Copy Host-Cached Outputs for GitHub's Cache
      id: outputs-publish
      if: ${{ success() && steps.outputs-host-lookup.outputs.cache-hit == 'true' && steps.outputs-lookup.outputs.cache-hit != 'true' && matrix.output_key != '' }}
      continue-on-error: true
      run: |
        set -euo pipefail
        store="${ENACT_OUTPUTS_CACHE:-}"
        entry="$store/${GITHUB_REPOSITORY:-repo}/$ENACT_OUTPUTS_KEY"
        clone_item() {
            rm -rf "$2"
            mkdir -p "$(dirname "$2")"
            cp -a --reflink=auto "$1" "$2" 2>/dev/null || { rm -rf "$2"; cp -a "$1" "$2"; }
        }
        case "$ENACT_OUTPUTS_MODE" in
            restore)
                hit=false
                if [ -n "$store" ] && [ -f "$entry/.enact-ready" ]; then
                    hit=true
                    while IFS= read -r pattern; do
                        [ -n "$pattern" ] || continue
                        # shellcheck disable=SC2086 # glob pattern from outputs.paths
                        for src in "$entry"/$pattern; do
                            [ -e "$src" ] || [ -L "$src" ] || { hit=false; break 2; }
                            rel="${src#"$entry"/}"
                            clone_item "$src" "$rel" || { hit=false; break 2; }
                        done
                    done <<<"$ENACT_OUTPUTS_PATHS"
                fi
                if [ "$hit" = true ]; then
                    touch "$entry/.enact-ready" 2>/dev/null || true
                fi
                printf 'cache-hit=%s\n' "$hit" >> "$GITHUB_OUTPUT"
                ;;
            save)
                [ -n "$store" ] || exit 0
                [ ! -f "$entry/.enact-ready" ] || exit 0
                mkdir -p "$(dirname "$entry")"
                tmp=$(mktemp -d "$entry.tmp.XXXXXX")
                trap 'rm -rf "$tmp"' EXIT
                while IFS= read -r pattern; do
                    [ -n "$pattern" ] || continue
                    # shellcheck disable=SC2086 # glob pattern from outputs.paths
                    for src in $pattern; do
                        [ -e "$src" ] || [ -L "$src" ] || exit 1
                        clone_item "$src" "$tmp/$src"
                    done
                done <<<"$ENACT_OUTPUTS_PATHS"
                touch "$tmp/.enact-ready"
                chmod -R a+rX "$tmp" 2>/dev/null || true
                if ! mv -n "$tmp" "$entry" 2>/dev/null && [ ! -d "$entry" ]; then
                    rm -rf "$entry"
                    mv "$tmp" "$entry"
                fi
                repo_dir="$(dirname "$entry")"
                max_entries="${ENACT_OUTPUTS_CACHE_MAX_ENTRIES:-8}"
                min_free_mb="${ENACT_OUTPUTS_CACHE_MIN_FREE_MB:-5120}"
                ready_files=()
                while IFS= read -r ready; do
                    [ -n "$ready" ] && ready_files+=("$ready")
                done < <(ls -1dt "$repo_dir"/*/.enact-ready 2>/dev/null || true)
                total="${#ready_files[@]}"
                for (( idx = total - 1; idx >= 0; idx-- )); do
                    cand_dir="$(dirname "${ready_files[$idx]}")"
                    [ "$cand_dir" != "$entry" ] || continue
                    evict=false
                    if [ "$max_entries" -gt 0 ] && [ "$((idx + 1))" -gt "$max_entries" ]; then
                        evict=true
                    elif [ "$min_free_mb" -gt 0 ]; then
                        free_mb="$(df -Pk "$store" 2>/dev/null | awk 'NR==2 {print int($4 / 1024)}')"
                        if [ -n "$free_mb" ] && [ "$free_mb" -lt "$min_free_mb" ]; then
                            evict=true
                        fi
                    fi
                    if [ "$evict" = true ]; then
                        rm -rf "$cand_dir" 2>/dev/null || true
                    fi
                done
                ;;
        esac
      env:
        ENACT_OUTPUTS_KEY: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        ENACT_OUTPUTS_MODE: restore
        ENACT_OUTPUTS_PATHS: ${{ matrix.output_paths }}
    - name: Cache Built Outputs
      if: ${{ success() && (!steps.skip.outputs.hit || steps.outputs-publish.outputs.cache-hit == 'true') && matrix.output_key != '' }}
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.output_key }}
        path: ${{ matrix.output_paths }}
